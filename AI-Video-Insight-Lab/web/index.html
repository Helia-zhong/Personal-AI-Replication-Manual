<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Video Insight Lab</title>
  <style>
    :root {
      --ink: #162032;
      --muted: #627084;
      --line: #d7e0eb;
      --panel: #ffffff;
      --bg: #f4f7fb;
      --blue: #315fdc;
      --green: #1f8a61;
      --amber: #d9861f;
      --red: #ca4747;
      --hook: #eef4ff;
      --problem: #fff1f1;
      --demo: #f2fbf4;
      --proof: #fff7ea;
      --cta: #f3f7ff;
      --intro: #eef8ff;
      --policy: #fff4e7;
      --example: #f4f0ff;
      --qa: #f6fbf8;
      --wrap: #eef7f5;
      --setup: #f8fbff;
      --reveal: #fff7ef;
      --takeaway: #f3f7ff;
      --closing: #f7f2ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      padding: 26px clamp(18px, 4vw, 48px) 18px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 3vw, 40px);
      line-height: 1.08;
    }

    .subtitle {
      margin: 8px 0 0;
      max-width: 850px;
      color: var(--muted);
      line-height: 1.7;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }

    select,
    button,
    input[type="range"] {
      font: inherit;
    }

    select,
    button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
    }

    select {
      padding: 0 12px;
    }

    button {
      padding: 0 14px;
      cursor: pointer;
    }

    button.primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    button:hover {
      border-color: #a7b5c9;
    }

    button.primary:hover {
      background: #0f1724;
    }

    main {
      width: min(1240px, calc(100% - 32px));
      margin: 22px auto 42px;
      display: grid;
      gap: 18px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 12px;
    }

    .metric,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 16px 34px rgba(41, 54, 82, 0.08);
    }

    .metric {
      min-height: 92px;
      padding: 14px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    .value {
      margin-top: 8px;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
    }

    .panel {
      padding: 18px;
      min-width: 0;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .player {
      display: grid;
      gap: 12px;
    }

    .preview {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      border: 1px solid rgba(22, 32, 50, 0.08);
      background: #eef3f8;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }

    .preview-inner {
      width: 100%;
      padding: 18px;
      display: grid;
      gap: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.22));
    }

    .preview-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      color: var(--ink);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 74px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #eef2f7;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .chip.good {
      background: #e8f7ef;
      color: var(--green);
    }

    .chip.warn {
      background: #fff3df;
      color: #a96b10;
    }

    .scene-title {
      font-size: 24px;
      line-height: 1.1;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .scene-visual {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.7;
      overflow-wrap: anywhere;
      max-width: 760px;
    }

    .scene-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .meta-box {
      padding: 10px 12px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(22, 32, 50, 0.08);
      color: var(--muted);
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .timeline-wrap {
      display: grid;
      gap: 10px;
    }

    .scrubber {
      width: 100%;
      accent-color: var(--blue);
    }

    .timeline {
      display: grid;
      gap: 8px;
    }

    .segment {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 12px;
      background: #fafcff;
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr) 72px;
      gap: 10px;
      align-items: center;
      cursor: pointer;
    }

    .segment.active {
      border-color: var(--blue);
      background: #eef4ff;
    }

    .segment-title {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .segment-sub,
    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .analysis-grid {
      display: grid;
      gap: 12px;
    }

    .status-box,
    .detail-box,
    .clip-card,
    .issue-item {
      border-radius: 7px;
      border: 1px solid var(--line);
      background: #fafcff;
      padding: 12px;
    }

    .status-box {
      border-left: 4px solid var(--blue);
    }

    .status-box.good {
      border-left-color: var(--green);
    }

    .status-box.warn {
      border-left-color: var(--amber);
    }

    .status-box.bad {
      border-left-color: var(--red);
    }

    .detail-box + .detail-box {
      margin-top: 12px;
    }

    .detail-box strong {
      display: block;
      margin-bottom: 6px;
    }

    .detail-box p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .issues,
    .clips,
    .highlights {
      display: grid;
      gap: 10px;
    }

    .issue-item {
      border-left: 4px solid var(--amber);
    }

    .issue-item.high {
      border-left-color: var(--red);
      background: #fff3f3;
    }

    .issue-item.medium {
      border-left-color: var(--amber);
      background: #fff8eb;
    }

    .issue-item.low {
      border-left-color: var(--green);
      background: #f3fbf7;
    }

    .clip-card {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr) 78px;
      gap: 10px;
      align-items: center;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .clip-card.active {
      border-color: var(--blue);
      background: #f3f7ff;
    }

    .clip-card:hover {
      border-color: #a7b5c9;
    }

    .scene-list {
      display: grid;
      gap: 8px;
      max-height: 250px;
      overflow: auto;
    }

    .scene-item {
      border-radius: 7px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 10px 12px;
      cursor: pointer;
      display: grid;
      gap: 4px;
    }

    .scene-item.active {
      border-color: var(--blue);
      background: #eef4ff;
    }

    .scene-item strong {
      overflow-wrap: anywhere;
    }

    .highlights .chip {
      min-width: 0;
      justify-content: flex-start;
      gap: 6px;
    }

    @media (max-width: 1000px) {
      header,
      .grid {
        grid-template-columns: 1fr;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .metrics {
        grid-template-columns: 1fr;
      }

      .scene-meta {
        grid-template-columns: 1fr;
      }

      .segment {
        grid-template-columns: 1fr;
      }

      .clip-card {
        grid-template-columns: 1fr;
      }

      .toolbar {
        justify-content: flex-start;
      }

      select,
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AI Video Insight Lab</h1>
      <p class="subtitle">视频场景理解和高光分析工作台：镜头切分、字幕覆盖、OCR、音频事件与剪辑建议。</p>
    </div>
    <div class="toolbar">
      <select id="clipSelect"></select>
      <select id="speedSelect">
        <option value="1">1x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
      <button id="playButton" class="primary">Play</button>
      <button id="prevButton">Prev</button>
      <button id="nextButton">Next</button>
      <button id="resetButton">Reset</button>
      <button id="exportButton">Export report</button>
    </div>
  </header>

  <main>
    <section class="metrics" id="metrics"></section>

    <section class="grid">
      <div class="panel">
        <h2>Storyboard Player</h2>
        <div class="player">
          <div class="preview" id="preview">
            <div class="preview-inner">
              <div class="preview-top">
                <span class="chip" id="sceneChip">Scene</span>
                <span class="chip" id="timeChip">0 / 0</span>
              </div>
              <div class="scene-title" id="sceneTitle"></div>
              <div class="scene-visual" id="sceneVisual"></div>
              <div class="scene-meta">
                <div class="meta-box" id="sceneTranscript"></div>
                <div class="meta-box" id="sceneDetails"></div>
              </div>
            </div>
          </div>

          <div class="timeline-wrap">
            <input class="scrubber" id="scrubber" type="range" min="0" max="100" value="0">
            <div class="timeline" id="timeline"></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>Analysis</h2>
        <div class="analysis-grid">
          <div class="status-box" id="summaryBox"></div>
          <div class="detail-box">
            <strong>Issues</strong>
            <div class="issues" id="issueList"></div>
          </div>
          <div class="detail-box">
            <strong>Highlights</strong>
            <div class="highlights" id="highlightList"></div>
          </div>
          <div class="detail-box">
            <strong>Scenes</strong>
            <div class="scene-list" id="sceneList"></div>
          </div>
          <div class="detail-box">
            <strong>Clips</strong>
            <div class="clips" id="clipList"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const clips = [
      {
        id: "launch-teaser",
        title: "Product Launch Teaser",
        duration_sec: 72,
        format: "teaser",
        theme: "launch",
        description: "一条产品发布预告，强调问题、演示和行动号召。",
        highlights: [
          { start: 0, end: 8, reason: "opening hook" },
          { start: 18, end: 34, reason: "product demo" },
          { start: 50, end: 72, reason: "call to action" }
        ],
        scenes: [
          { id: "lt-01", start: 0, end: 8, label: "hook", visual: "Presenter walks in front of a clean studio backdrop.", transcript: "What if your team could answer every product question in seconds?", ocr: "AI Assistant", audio: "uplift intro sting", objects: ["presenter", "screen", "logo"] },
          { id: "lt-02", start: 8, end: 18, label: "problem", visual: "Dashboard shows scattered tools and slow support queues.", transcript: "Most teams lose time switching between tools and hunting for the right answer.", ocr: "slow queue", audio: "voiceover", objects: ["dashboard", "queue", "chat"] },
          { id: "lt-03", start: 18, end: 34, label: "demo", visual: "The product opens a fast answer panel with citations and actions.", transcript: "The assistant pulls a grounded answer, cites the source, and offers a next step.", ocr: "source cited", audio: "clicks and UI blips", objects: ["assistant panel", "citation", "controls"] },
          { id: "lt-04", start: 34, end: 50, label: "proof", visual: "Metric cards animate with higher resolution and lower handoff time.", transcript: "Teams get faster first replies, better traceability, and fewer manual handoffs.", ocr: "42% faster", audio: "bass pulse", objects: ["metric cards", "trend line", "team"] },
          { id: "lt-05", start: 50, end: 72, label: "cta", visual: "End card invites viewers to book a demo and explore the workflow.", transcript: "Book a demo and see the workflow in action.", ocr: "Book a demo", audio: "closing hit", objects: ["cta card", "calendar", "brand mark"] }
        ]
      },
      {
        id: "support-recap",
        title: "Support Training Recap",
        duration_sec: 96,
        format: "recap",
        theme: "training",
        description: "客服培训回顾，适合观察字幕覆盖和信息密度。",
        highlights: [
          { start: 4, end: 16, reason: "agenda" },
          { start: 28, end: 44, reason: "policy example" },
          { start: 62, end: 78, reason: "escalation checklist" }
        ],
        scenes: [
          { id: "sr-01", start: 0, end: 12, label: "intro", visual: "Trainer opens with the agenda and session goals.", transcript: "Today we will review escalation rules, privacy checks, and handoff etiquette.", ocr: "Agenda", audio: "spoken agenda", objects: ["trainer", "slides"] },
          { id: "sr-02", start: 12, end: 28, label: "policy", visual: "Checklist appears with policy examples and do-not-share warnings.", transcript: "Use the policy checklist before answering any account or billing question.", ocr: "Do not share secrets", audio: "cursor clicks", objects: ["checklist", "policy card", "cursor"] },
          { id: "sr-03", start: 28, end: 44, label: "example", visual: "A sample chat illustrates the right refusal and a proper redirect.", transcript: "If the request is sensitive, refuse briefly and guide the customer to the approved flow.", ocr: "approved flow", audio: "chat notification", objects: ["chat window", "badge", "arrow"] },
          { id: "sr-04", start: 44, end: 62, label: "qa", visual: "Participants ask questions while the trainer annotates the screen.", transcript: "Questions should be answered with the policy page open beside the ticket.", ocr: "ticket", audio: "room ambience", objects: ["annotation tool", "ticket", "policy page"] },
          { id: "sr-05", start: 62, end: 82, label: "checklist", visual: "The final checklist appears with escalation tiers and contact points.", transcript: "Use the escalation ladder when the customer is blocked, upset, or waiting too long.", ocr: "tier 1 tier 2", audio: "voiceover", objects: ["checklist", "tier card", "contact list"] },
          { id: "sr-06", start: 82, end: 96, label: "wrap", visual: "Closing slide asks viewers to review the policy handbook later.", transcript: "Please review the handbook and keep the cheat sheet handy.", ocr: "", audio: "closing tone", objects: ["handbook", "bookmark"] }
        ]
      },
      {
        id: "webinar-cutdown",
        title: "Webinar Cutdown",
        duration_sec: 84,
        format: "cutdown",
        theme: "webinar",
        description: "长视频剪成短片的练习，包含一个过长镜头和一个空字幕镜头。",
        highlights: [
          { start: 10, end: 26, reason: "feature reveal" },
          { start: 36, end: 58, reason: "live demo" },
          { start: 64, end: 82, reason: "closing takeaway" }
        ],
        scenes: [
          { id: "wc-01", start: 0, end: 10, label: "setup", visual: "Moderator introduces the webinar topic and speakers.", transcript: "Welcome to the session and thanks for joining us today.", ocr: "webinar", audio: "intro music", objects: ["moderator", "speaker card"] },
          { id: "wc-02", start: 10, end: 26, label: "reveal", visual: "The host reveals the main feature with a sleek product slide.", transcript: "The new workflow saves time by connecting answers, actions, and follow-up tasks.", ocr: "new workflow", audio: "slide transition", objects: ["product slide", "feature badge", "task list"] },
          { id: "wc-03", start: 26, end: 44, label: "demo", visual: "A live screen share shows the workflow in action.", transcript: "Here is the live demo with search, rerank, and review steps in one flow.", ocr: "search rerank review", audio: "screen share audio", objects: ["browser window", "steps", "cursor"] },
          { id: "wc-04", start: 44, end: 58, label: "example", visual: "A long explanatory segment lingers on architecture details.", transcript: "The architecture discussion continues with extra detail on implementation decisions and trade-offs.", ocr: "architecture", audio: "speaker voice", objects: ["diagram", "speaker", "code block"] },
          { id: "wc-05", start: 58, end: 72, label: "takeaway", visual: "The host summarizes the main lessons and next steps.", transcript: "", ocr: "takeaway", audio: "closing voiceover", objects: ["summary card", "check mark"] },
          { id: "wc-06", start: 72, end: 84, label: "cta", visual: "A final call to action invites viewers to try the workflow.", transcript: "Try the workflow and share your results with the team.", ocr: "try it", audio: "ending hit", objects: ["cta card", "button"] }
        ]
      },
      {
        id: "release-story",
        title: "Release Story Clip",
        duration_sec: 60,
        format: "story",
        theme: "release",
        description: "发布故事短片，强调节奏和镜头均衡。",
        highlights: [
          { start: 6, end: 18, reason: "problem setup" },
          { start: 22, end: 36, reason: "product turn" },
          { start: 42, end: 58, reason: "closing payoff" }
        ],
        scenes: [
          { id: "rs-01", start: 0, end: 6, label: "intro", visual: "Fast opening montage shows the team preparing the release.", transcript: "This release changes the way the team works.", ocr: "release day", audio: "beat intro", objects: ["team", "release board"] },
          { id: "rs-02", start: 6, end: 18, label: "problem", visual: "Old workflow pain points appear on screen with stacked cards.", transcript: "The old process was slow, manual, and hard to trace.", ocr: "slow manual trace", audio: "voiceover", objects: ["cards", "workflow", "timer"] },
          { id: "rs-03", start: 18, end: 30, label: "turn", visual: "The new product screen replaces the old flow with one clean panel.", transcript: "The new panel combines answers, actions, and evidence in one place.", ocr: "one panel", audio: "screen click", objects: ["panel", "evidence", "actions"] },
          { id: "rs-04", start: 30, end: 42, label: "proof", visual: "Metrics slide shows better response time and clearer review steps.", transcript: "Metrics improve because the team can see what happened at a glance.", ocr: "faster response", audio: "music rise", objects: ["chart", "metric card", "review step"] },
          { id: "rs-05", start: 42, end: 60, label: "closing", visual: "Ending frame repeats the release message and the team's next milestone.", transcript: "The release is live, and the next milestone is already in motion.", ocr: "now live", audio: "closing note", objects: ["closing card", "milestone", "brand mark"] }
        ]
      }
    ];

    const labelPalette = {
      hook: getVar("--hook"),
      problem: getVar("--problem"),
      demo: getVar("--demo"),
      proof: getVar("--proof"),
      cta: getVar("--cta"),
      intro: getVar("--intro"),
      policy: getVar("--policy"),
      example: getVar("--example"),
      qa: getVar("--qa"),
      wrap: getVar("--wrap"),
      setup: getVar("--setup"),
      reveal: getVar("--reveal"),
      takeaway: getVar("--takeaway"),
      closing: getVar("--closing")
    };

    const STORAGE_KEY = "ai-video-insight-lab-state-v2";

    function getVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    const state = {
      clipId: clips[0].id,
      currentTime: 0,
      playing: false,
      speed: 1,
      timer: null,
      currentSceneIndex: 0
    };

    function persistState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          clipId: state.clipId,
          currentTime: state.currentTime,
          speed: state.speed
        }));
      } catch (error) {
        // Persistence is best-effort only.
      }
    }

    function loadPersistedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const saved = JSON.parse(raw);
        const clip = clipById(saved.clipId);
        if (!clip || clip.id !== saved.clipId) return null;
        return {
          clipId: clip.id,
          currentTime: Math.max(0, Math.min(clip.duration_sec, Number(saved.currentTime) || 0)),
          speed: [1, 1.5, 2].includes(Number(saved.speed)) ? Number(saved.speed) : 1
        };
      } catch (error) {
        return null;
      }
    }

    function downloadText(filename, content) {
      const blob = new Blob([content], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function buildReport(clip, inspection) {
      const metricPercent = value => `${Math.round(value * 100)}%`;
      const lines = [
        `# ${clip.title}`,
        "",
        `- Duration: ${clip.duration_sec}s`,
        `- Format: ${clip.format}`,
        `- Theme: ${clip.theme}`,
        `- Overall quality: ${metricPercent(inspection.metrics.overall_quality)}`,
        "",
        "## Summary",
        clip.description,
        "",
        "## Metrics",
        "| Metric | Value |",
        "| --- | ---: |",
        `| Scene count | ${inspection.metrics.scene_count} |`,
        `| Transcript coverage | ${metricPercent(inspection.metrics.transcript_coverage)} |`,
        `| OCR coverage | ${metricPercent(inspection.metrics.ocr_coverage)} |`,
        `| Audio coverage | ${metricPercent(inspection.metrics.audio_coverage)} |`,
        `| Highlight ratio | ${metricPercent(inspection.metrics.highlight_ratio)} |`,
        `| Highlight fit | ${metricPercent(inspection.metrics.highlight_fit)} |`,
        `| Scene balance | ${metricPercent(inspection.metrics.scene_balance)} |`,
        `| Transcript density | ${inspection.metrics.transcript_density} chars/sec |`,
        "",
        "## Issues",
      ];
      if (inspection.issues.length) {
        inspection.issues.forEach(issue => {
          lines.push(`- ${issue.severity}: ${issue.type} - ${issue.message}`);
        });
      } else {
        lines.push("- No major issues detected.");
      }
      lines.push(
        "",
        "## Recommendations",
        ...inspection.recommendations.map(item => `- ${item}`),
        "",
        "## Scenes",
        "| Scene | Window | Duration | Visual | Transcript |",
        "| --- | --- | ---: | --- | --- |"
      );
      clip.scenes.forEach(scene => {
        lines.push(
          `| ${scene.id} | ${scene.start}s-${scene.end}s | ${scene.end - scene.start}s | ${scene.visual} | ${scene.transcript || "none"} |`
        );
      });
      lines.push("", "## Highlights");
      clip.highlights.forEach(item => {
        lines.push(`- ${item.start}s-${item.end}s: ${item.reason}`);
      });
      return lines.join("\n") + "\n";
    }

    function exportReport() {
      const clip = currentClip();
      const inspection = inspectClip(clip);
      const stamp = new Date().toISOString().replace(/[:.]/g, "-");
      downloadText(`ai-video-insight-${clip.id}-${stamp}.md`, buildReport(clip, inspection));
    }

    function clipById(id) {
      return clips.find(clip => clip.id === id) || clips[0];
    }

    function sceneDuration(scene) {
      return scene.end - scene.start;
    }

    function coverageScore(clip, key) {
      const filled = clip.scenes.filter(scene => String(scene[key] || "").trim()).length;
      return filled / Math.max(clip.scenes.length, 1);
    }

    function highlightRatio(clip) {
      const total = clip.highlights.reduce((sum, item) => sum + (item.end - item.start), 0);
      return total / Math.max(clip.duration_sec, 1);
    }

    function sceneBalanceScore(clip) {
      const avg = clip.duration_sec / Math.max(clip.scenes.length, 1);
      if (avg >= 5 && avg <= 14) return 1;
      if (avg >= 4 && avg <= 18) return 0.72;
      if (avg > 20) return 0.35;
      return 0.58;
    }

    function highlightFitScore(clip) {
      const ratio = highlightRatio(clip);
      if (ratio >= 0.18 && ratio <= 0.42) return 1;
      if (ratio >= 0.12 && ratio <= 0.55) return 0.72;
      if (ratio < 0.12) return 0.4;
      return 0.5;
    }

    function audioCoverage(clip) {
      return coverageScore(clip, "audio");
    }

    function issueList(clip) {
      const issues = [];
      const missingCaptions = clip.scenes.filter(scene => !String(scene.transcript || "").trim()).map(scene => scene.id);
      const missingOcr = clip.scenes.filter(scene => !String(scene.ocr || "").trim()).map(scene => scene.id);
      const longScenes = clip.scenes.filter(scene => sceneDuration(scene) >= 18).map(scene => scene.id);
      const ratio = highlightRatio(clip);

      if (missingCaptions.length) {
        issues.push({ severity: "high", type: "missing_caption", message: `字幕缺失镜头：${missingCaptions.join(", ")}。` });
      }
      if (missingOcr.length >= Math.max(Math.floor(clip.scenes.length / 2), 2)) {
        issues.push({ severity: "medium", type: "ocr_sparse", message: "OCR 覆盖偏低，难以用于关键词检索。" });
      }
      if (longScenes.length) {
        issues.push({ severity: "medium", type: "long_scene", message: `存在过长镜头：${longScenes.join(", ")}。` });
      }
      if (ratio > 0.5) {
        issues.push({ severity: "medium", type: "highlight_overflow", message: "高光窗口过密，成片节奏会偏散。" });
      }
      if (ratio < 0.12) {
        issues.push({ severity: "medium", type: "highlight_sparse", message: "高光窗口偏少，适合补入更强的片段。" });
      }
      if (audioCoverage(clip) < 0.5) {
        issues.push({ severity: "low", type: "audio_sparse", message: "音频事件信息较少，可补充解说或环境音标注。" });
      }
      return issues;
    }

    function recommendActions(clip) {
      const issues = issueList(clip);
      const recommendations = [];
      if (issues.some(issue => issue.type === "missing_caption")) recommendations.push("补齐字幕并对空段进行人工转写。");
      if (issues.some(issue => issue.type === "ocr_sparse")) recommendations.push("为关键镜头增加 OCR 或画面文字标注。");
      if (issues.some(issue => issue.type === "long_scene")) recommendations.push("把过长镜头拆短，增强节奏变化。");
      if (issues.some(issue => issue.type === "highlight_overflow")) recommendations.push("收紧高光窗口，只保留信息密度最高的片段。");
      if (!recommendations.length) recommendations.push("当前 clip 结构稳定，可继续扩充相似风格样例。");
      return recommendations;
    }

    function inspectClip(clip) {
      const transcriptCoverage = coverageScore(clip, "transcript");
      const ocrCoverage = coverageScore(clip, "ocr");
      const audioCov = audioCoverage(clip);
      const balance = sceneBalanceScore(clip);
      const hFit = highlightFitScore(clip);
      const density = clip.scenes.reduce((sum, scene) => sum + String(scene.transcript || "").trim().length, 0) / Math.max(clip.duration_sec, 1);
      const overall = 0.3 * transcriptCoverage + 0.18 * ocrCoverage + 0.2 * hFit + 0.17 * balance + 0.15 * audioCov;
      return {
        metrics: {
          scene_count: clip.scenes.length,
          transcript_coverage: Number(transcriptCoverage.toFixed(4)),
          ocr_coverage: Number(ocrCoverage.toFixed(4)),
          audio_coverage: Number(audioCov.toFixed(4)),
          highlight_ratio: Number(highlightRatio(clip).toFixed(4)),
          highlight_fit: Number(hFit.toFixed(4)),
          scene_balance: Number(balance.toFixed(4)),
          transcript_density: Number(density.toFixed(4)),
          overall_quality: Number(overall.toFixed(4))
        },
        issues: issueList(clip),
        recommendations: recommendActions(clip)
      };
    }

    function currentClip() {
      return clipById(state.clipId);
    }

    function sceneAtTime(clip, time) {
      const index = clip.scenes.findIndex(scene => time >= scene.start && time < scene.end);
      return index >= 0 ? index : clip.scenes.length - 1;
    }

    function clampTime(clip, time) {
      return Math.max(0, Math.min(clip.duration_sec, time));
    }

    function labelColor(label) {
      return labelPalette[label] || "#eef3f8";
    }

    function updateTimeFromScene(index) {
      const clip = currentClip();
      const scene = clip.scenes[index] || clip.scenes[0];
      if (!scene) return;
      state.currentSceneIndex = index;
      state.currentTime = scene.start;
      render();
    }

    function renderPreview(clip, scene) {
      const preview = document.getElementById("preview");
      preview.style.background = labelColor(scene.label);
      document.getElementById("sceneChip").textContent = `${clip.format} · ${scene.label}`;
      document.getElementById("timeChip").textContent = `${Math.round(state.currentTime)} / ${clip.duration_sec}s`;
      document.getElementById("sceneTitle").textContent = `${scene.id} · ${scene.label}`;
      document.getElementById("sceneVisual").textContent = scene.visual;
      document.getElementById("sceneTranscript").textContent = `Transcript: ${scene.transcript || "none"}\nOCR: ${scene.ocr || "none"}`;
      document.getElementById("sceneDetails").textContent = `Audio: ${scene.audio || "none"}\nObjects: ${(scene.objects || []).join(", ") || "none"}\nWindow: ${scene.start}s - ${scene.end}s`;
    }

    function renderTimeline(clip, sceneIndex) {
      document.getElementById("timeline").innerHTML = clip.scenes.map((scene, index) => `
        <div class="segment ${index === sceneIndex ? "active" : ""}" data-scene-index="${index}">
          <div><span class="chip">${scene.label}</span></div>
          <div>
            <div class="segment-title">${scene.visual}</div>
            <div class="segment-sub">${scene.start}s - ${scene.end}s · ${scene.audio}</div>
          </div>
          <div class="segment-sub" style="text-align:right">${sceneDuration(scene)}s</div>
        </div>
      `).join("");
      document.querySelectorAll(".segment").forEach(segment => {
        segment.addEventListener("click", () => {
          const index = Number(segment.dataset.sceneIndex);
          const scene = clip.scenes[index];
          state.currentTime = scene.start;
          state.currentSceneIndex = index;
          state.playing = false;
          stopPlayback();
          render();
        });
      });
      const scrubber = document.getElementById("scrubber");
      scrubber.max = clip.duration_sec;
      scrubber.value = state.currentTime;
      scrubber.addEventListener("input", () => {
        state.currentTime = Number(scrubber.value);
        state.currentSceneIndex = sceneAtTime(clip, state.currentTime);
        render();
      }, { once: true });
    }

    function renderAnalysis(clip, inspection) {
      document.getElementById("metrics").innerHTML = [
        ["Scenes", inspection.metrics.scene_count],
        ["Captions", `${Math.round(inspection.metrics.transcript_coverage * 100)}%`],
        ["OCR", `${Math.round(inspection.metrics.ocr_coverage * 100)}%`],
        ["Highlights", `${Math.round(inspection.metrics.highlight_ratio * 100)}%`],
        ["Overall", `${Math.round(inspection.metrics.overall_quality * 100)}%`]
      ].map(([label, value]) => `
        <div class="metric">
          <div class="label">${label}</div>
          <div class="value">${value}</div>
        </div>
      `).join("");

      document.getElementById("issueList").innerHTML = inspection.issues.length ? inspection.issues.map(issue => `
        <div class="issue-item ${issue.severity}">
          <strong>${issue.type}</strong>
          <div class="muted">${issue.message}</div>
        </div>
      `).join("") : "<p class=\"muted\">当前 clip 没有明显问题。</p>";

      document.getElementById("highlightList").innerHTML = clip.highlights.map(item => `
        <div class="chip ${item.reason.includes("demo") || item.reason.includes("call") ? "good" : "warn"}">${item.start}s - ${item.end}s · ${item.reason}</div>
      `).join("");

      document.getElementById("sceneList").innerHTML = clip.scenes.map((scene, index) => `
        <div class="scene-item ${index === state.currentSceneIndex ? "active" : ""}" data-scene-index="${index}">
          <strong>${scene.label} · ${scene.start}s - ${scene.end}s</strong>
          <div class="muted">${scene.visual}</div>
        </div>
      `).join("");
      document.querySelectorAll(".scene-item").forEach(item => {
        item.addEventListener("click", () => {
          const index = Number(item.dataset.sceneIndex);
          state.currentSceneIndex = index;
          state.currentTime = clip.scenes[index].start;
          state.playing = false;
          stopPlayback();
          render();
        });
      });

      document.getElementById("clipList").innerHTML = clips.map(item => `
        <div class="clip-card ${item.id === clip.id ? "active" : ""}" data-clip-id="${item.id}">
          <div><span class="chip">${item.format}</span></div>
          <div>
            <div class="segment-title">${item.title}</div>
            <div class="segment-sub">${item.duration_sec}s · ${item.description}</div>
          </div>
          <div style="text-align:right"><span class="chip ${item.id === clip.id ? "good" : "warn"}">${item.theme}</span></div>
        </div>
      `).join("");
      document.querySelectorAll(".clip-card").forEach(card => {
        card.addEventListener("click", () => {
          state.clipId = card.dataset.clipId;
          state.currentTime = 0;
          state.currentSceneIndex = 0;
          state.playing = false;
          stopPlayback();
          render();
        });
      });

      const recommendation = inspection.recommendations[0];
      const statusClass = inspection.issues.length ? (inspection.issues.some(issue => issue.severity === "high") ? "bad" : "warn") : "good";
      document.getElementById("timeChip").textContent = `${Math.round(state.currentTime)} / ${clip.duration_sec}s`;
      document.getElementById("playButton").textContent = state.playing ? "Pause" : "Play";
      document.getElementById("playButton").className = state.playing ? "" : "primary";
      document.getElementById("summaryBox").className = `status-box ${statusClass}`;
      document.getElementById("summaryBox").innerHTML = `
        <strong>${clip.title}</strong>
        <div class="muted">${clip.description}</div>
        <div class="muted">Overall quality: ${Math.round(inspection.metrics.overall_quality * 100)}%</div>
        <div class="muted">${recommendation}</div>
      `;
    }

    function render() {
      const clip = currentClip();
      const sceneIndex = sceneAtTime(clip, state.currentTime);
      state.currentSceneIndex = Math.max(0, sceneIndex);
      const scene = clip.scenes[state.currentSceneIndex];
      const inspection = inspectClip(clip);
      renderPreview(clip, scene);
      renderTimeline(clip, state.currentSceneIndex);
      renderAnalysis(clip, inspection);
      document.getElementById("clipSelect").value = clip.id;
      document.getElementById("speedSelect").value = String(state.speed);
      document.getElementById("scrubber").value = state.currentTime;
      persistState();
    }

    function stopPlayback() {
      if (state.timer) {
        clearInterval(state.timer);
        state.timer = null;
      }
      state.playing = false;
    }

    function startPlayback() {
      if (state.timer) clearInterval(state.timer);
      state.playing = true;
      state.speed = Number(document.getElementById("speedSelect").value);
      const speed = state.speed;
      state.timer = setInterval(() => {
        const clip = currentClip();
        state.currentTime = clampTime(clip, state.currentTime + Math.max(1, speed));
        const nextIndex = sceneAtTime(clip, state.currentTime);
        state.currentSceneIndex = nextIndex;
        if (state.currentTime >= clip.duration_sec) {
          stopPlayback();
        }
        render();
      }, 700);
      render();
    }

    function togglePlayback() {
      if (state.playing) {
        stopPlayback();
        render();
      } else {
        startPlayback();
      }
    }

    function nextScene() {
      const clip = currentClip();
      const index = Math.min(state.currentSceneIndex + 1, clip.scenes.length - 1);
      state.currentSceneIndex = index;
      state.currentTime = clip.scenes[index].start;
      state.playing = false;
      stopPlayback();
      render();
    }

    function prevScene() {
      const clip = currentClip();
      const index = Math.max(state.currentSceneIndex - 1, 0);
      state.currentSceneIndex = index;
      state.currentTime = clip.scenes[index].start;
      state.playing = false;
      stopPlayback();
      render();
    }

    function resetClip() {
      state.currentTime = 0;
      state.currentSceneIndex = 0;
      state.playing = false;
      stopPlayback();
      render();
    }

    function populateSelectors() {
      const clipSelect = document.getElementById("clipSelect");
      clipSelect.innerHTML = clips.map(clip => `<option value="${clip.id}">${clip.title}</option>`).join("");
      clipSelect.addEventListener("change", () => {
        state.clipId = clipSelect.value;
        resetClip();
      });

      document.getElementById("playButton").addEventListener("click", togglePlayback);
      document.getElementById("prevButton").addEventListener("click", prevScene);
      document.getElementById("nextButton").addEventListener("click", nextScene);
      document.getElementById("resetButton").addEventListener("click", resetClip);
      document.getElementById("speedSelect").addEventListener("change", () => {
        state.speed = Number(document.getElementById("speedSelect").value);
        if (state.playing) {
          stopPlayback();
          startPlayback();
        } else {
          render();
        }
      });
      document.getElementById("exportButton").addEventListener("click", exportReport);
    }

    populateSelectors();
    const savedState = loadPersistedState();
    if (savedState) {
      state.clipId = savedState.clipId;
      state.currentTime = savedState.currentTime;
      state.speed = savedState.speed;
      document.getElementById("speedSelect").value = String(state.speed);
    }
    render();
    window.addEventListener("beforeunload", persistState);
  </script>
</body>
</html>
