<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AI Dataset Curation Lab 样本复核"><title>样本复核 | AI Dataset Curation Lab</title><link rel="stylesheet" href="styles.css?v=7.0.0"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script src="app.js?v=7.0.0" defer></script></head>
<body data-page="samples"><header class="app-header"><div class="header-inner"><a class="brand" href="index.html"><span class="brand-mark"><i data-lucide="database-zap"></i></span><span><strong>Dataset Lab</strong><small>CURATION CONTROL</small></span></a><nav class="main-nav" aria-label="主导航"><a href="index.html"><i data-lucide="layout-dashboard"></i><span>数据健康</span></a><a class="active" href="samples.html" aria-current="page"><i data-lucide="list-checks"></i><span>样本复核</span></a><a href="integrity.html"><i data-lucide="scan-search"></i><span>完整性扫描</span></a><a href="release.html"><i data-lucide="shield-check"></i><span>发布门禁</span></a></nav><div class="header-meta"><span class="runtime-state"><i></i> AUDIT ONLINE</span><a class="icon-button dark" href="../README.md" title="查看项目文档" aria-label="查看项目文档"><i data-lucide="file-text"></i></a></div></div></header>
<main class="page-shell"><section class="page-heading"><div><p class="eyebrow">SAMPLE REVIEW</p><h1>样本复核</h1><p id="sampleSubtitle">逐条检查格式、来源、支持度与完整性问题</p></div><div class="heading-actions sample-actions"><label class="search-control"><i data-lucide="search"></i><input id="sampleSearch" type="search" placeholder="搜索样本" aria-label="搜索样本"></label><button class="button button-secondary" id="exportSample" type="button"><i data-lucide="download"></i><span>导出样本</span></button></div></section>
<section class="filter-band"><label class="select-control wide"><span>数据集</span><select id="sampleDatasetSelect" aria-label="选择数据集"></select></label><label class="select-control"><span>Split</span><select id="splitFilter" aria-label="Split 筛选"><option value="all">全部 split</option><option value="train">train</option><option value="valid">valid</option><option value="test">test</option></select></label><label class="select-control"><span>审计状态</span><select id="issueFilter" aria-label="审计状态"><option value="all">全部样本</option><option value="flagged">存在问题</option><option value="clean">无问题</option><option value="high">高严重度</option></select></label></section>
<section class="metric-grid metric-grid-four"><article class="metric-accent"><span>综合质量</span><strong id="sampleDatasetQuality">--</strong><small>AVERAGE</small></article><article><span>来源覆盖</span><strong id="sampleSourceCoverage">--</strong><small>SOURCE</small></article><article><span>格式通过</span><strong id="sampleFormatPass">--</strong><small>FORMAT</small></article><article class="metric-danger"><span>问题样本</span><strong id="sampleFlagged">--</strong><small>FLAGGED</small></article></section>
<section class="sample-layout"><article class="panel sample-list-panel"><header class="panel-header"><div><p class="panel-kicker">REVIEW QUEUE</p><h2>样本队列</h2></div><span class="panel-note" id="sampleResultCount">0 SAMPLES</span></header><div class="sample-list" id="sampleList"></div></article><article class="panel sample-detail-panel"><header class="panel-header"><div><p class="panel-kicker">SAMPLE INSPECTOR</p><h2 id="sampleDetailTitle">样本详情</h2></div><span class="status-chip" id="sampleDetailStatus">--</span></header><div id="sampleDetail"></div></article></section></main><div class="toast" id="toast" role="status" aria-live="polite"></div></body></html>
