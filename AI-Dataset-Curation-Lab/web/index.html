<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Dataset Curation Lab</title>
  <style>
    :root {
      --ink: #162032;
      --muted: #637086;
      --line: #d8e0ea;
      --panel: #ffffff;
      --bg: #f4f7fb;
      --blue: #315fdc;
      --green: #1f8a61;
      --amber: #d9861f;
      --red: #ca4747;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      padding: 26px clamp(18px, 4vw, 48px) 18px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 3vw, 40px);
      line-height: 1.08;
    }

    .subtitle {
      margin: 8px 0 0;
      max-width: 820px;
      color: var(--muted);
      line-height: 1.7;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    select {
      min-height: 38px;
      min-width: 230px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 0 12px;
    }

    main {
      width: min(1200px, calc(100% - 32px));
      margin: 22px auto 42px;
      display: grid;
      gap: 18px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(130px, 1fr));
      gap: 12px;
    }

    .metric,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 16px 34px rgba(41, 54, 82, 0.08);
    }

    .metric {
      padding: 14px;
      min-height: 92px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    .value {
      margin-top: 8px;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
    }

    .panel {
      padding: 18px;
      min-width: 0;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    canvas {
      width: 100%;
      height: 320px;
      display: block;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .issue,
    .group,
    .sample-card,
    .detail-block {
      border-radius: 7px;
      border: 1px solid var(--line);
      background: #fafcff;
      padding: 12px;
    }

    .issue {
      border-left: 4px solid var(--amber);
    }

    .issue.high {
      border-left-color: var(--red);
      background: #fff3f3;
    }

    .issue.medium {
      border-left-color: var(--amber);
      background: #fff8eb;
    }

    .issue.low {
      border-left-color: var(--green);
      background: #f3fbf7;
    }

    .sample-list {
      display: grid;
      gap: 10px;
    }

    .sample-card {
      display: grid;
      grid-template-columns: 88px 96px minmax(0, 1fr) 92px;
      gap: 10px;
      align-items: center;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .sample-card.active {
      border-color: var(--blue);
      background: #f3f7ff;
    }

    .sample-card:hover {
      border-color: #aab6cb;
    }

    .chip {
      display: inline-block;
      min-width: 72px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #eef2f7;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .chip.good {
      background: #e9f7f0;
      color: var(--green);
    }

    .chip.warn {
      background: #fff4e1;
      color: #a86a10;
    }

    .chip.bad {
      background: #ffe9e9;
      color: var(--red);
    }

    .sample-title {
      font-weight: 700;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .sample-sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .detail-block + .detail-block {
      margin-top: 12px;
    }

    .detail-block strong {
      display: block;
      margin-bottom: 6px;
    }

    .detail-block p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .compact-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.7;
    }

    .dual {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    @media (max-width: 980px) {
      header,
      .grid,
      .dual {
        grid-template-columns: 1fr;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .metrics {
        grid-template-columns: 1fr;
      }

      .sample-card {
        grid-template-columns: 1fr;
      }

      .toolbar {
        justify-content: flex-start;
      }

      select {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AI Dataset Curation Lab</h1>
      <p class="subtitle">数据集质检台：检查重复、泄漏、来源缺失、格式偏差和样本健康度。</p>
    </div>
    <div class="toolbar">
      <select id="datasetSelect"></select>
      <select id="splitSelect">
        <option value="all">all splits</option>
        <option value="train">train</option>
        <option value="valid">valid</option>
        <option value="test">test</option>
      </select>
    </div>
  </header>

  <main>
    <section class="metrics" id="metrics"></section>

    <section class="grid">
      <div class="panel">
        <h2>样本质量</h2>
        <canvas id="qualityChart" width="940" height="360"></canvas>
      </div>
      <div class="panel">
        <h2>问题概览</h2>
        <div class="list" id="issueList"></div>
      </div>
    </section>

    <section class="dual">
      <div class="panel">
        <h2>样本列表</h2>
        <div class="sample-list" id="sampleList"></div>
      </div>
      <div class="panel">
        <h2>选中样本</h2>
        <div id="detail"></div>
      </div>
    </section>
  </main>

  <script>
    const datasets = [
      {
        id: "support-qa-playbook",
        title: "Support QA Playbook",
        task_type: "qa",
        allowed_labels: ["answerable", "abstain"],
        description: "客服问答与拒答样本，用于检查来源覆盖和回答边界。",
        samples: [
          { id: "qa-001", split: "train", label: "answerable", instruction: "How do I reset MFA after I changed my phone number?", response: "Go to account settings, verify your identity, and register the new device before disabling the old one.", source: "support policy note: account recovery steps require identity verification and device re-enrollment.", tags: ["account", "mfa", "support"] },
          { id: "qa-002", split: "train", label: "abstain", instruction: "Can you reveal internal admin API keys?", response: "I cannot help retrieve secrets or private keys. Please use the approved secret management flow.", source: "security policy: secrets must never be exposed in assistant responses.", tags: ["security", "refusal"] },
          { id: "qa-003", split: "valid", label: "answerable", instruction: "What should I do if my invoice payment failed twice?", response: "You can retry with a verified card, check whether the payment method is enabled, and contact billing support if the issue repeats.", source: "", tags: ["billing", "support"] },
          { id: "qa-004", split: "test", label: "abstain", instruction: "Can you share a customer's personal email address?", response: "Please send the full account name and I will look it up for you.", source: "privacy policy: personal contact details must not be disclosed.", tags: ["privacy", "refusal"] },
          { id: "qa-005", split: "test", label: "answerable", instruction: "How do I reset MFA after I changed my phone number?", response: "Go to account settings, verify your identity, and register the new device before disabling the old one.", source: "support policy note: account recovery steps require identity verification and device re-enrollment.", tags: ["account", "mfa", "duplicate"] }
        ]
      },
      {
        id: "contract-extraction-kit",
        title: "Contract Extraction Kit",
        task_type: "extraction",
        allowed_labels: ["structured"],
        description: "合同与政策字段抽取样本，检查结构化输出和来源完整性。",
        samples: [
          { id: "ex-001", split: "train", label: "structured", instruction: "Extract the renewal date, payment terms, and termination notice from the clause.", response: "{\"renewal_date\":\"2027-03-01\",\"payment_terms\":\"net 30\",\"termination_notice\":\"45 days\"}", source: "contract clause: renewal on 2027-03-01, payment due net 30, termination requires 45 days notice.", tags: ["json", "contracts"] },
          { id: "ex-002", split: "train", label: "structured", instruction: "Extract the vendor, price ceiling, and approval owner from the procurement note.", response: "- vendor: Northwind\n- price ceiling: 120000\n- approval owner: finance lead", source: "procurement note: Northwind, ceiling 120000, approval owner finance lead.", tags: ["procurement", "format_mismatch"] },
          { id: "ex-003", split: "valid", label: "structured", instruction: "Extract the claim amount, deductible, and insurer from the policy excerpt.", response: "{\"claim_amount\":\"8000\",\"deductible\":\"500\",\"insurer\":\"Blue Harbor\"}", source: "", tags: ["insurance", "missing_source"] },
          { id: "ex-004", split: "test", label: "structured", instruction: "Extract the renewal date, payment terms, and termination notice from the clause.", response: "{\"renewal_date\":\"2027-03-01\",\"payment_terms\":\"net 30\",\"termination_notice\":\"45 days\"}", source: "contract clause: renewal on 2027-03-01, payment due net 30, termination requires 45 days notice.", tags: ["json", "duplicate"] },
          { id: "ex-005", split: "test", label: "structured", instruction: "Extract the support window, escalation channel, and SLA target from the service note.", response: "{\"support_window\":\"24x7\",\"escalation_channel\":\"pager\",\"sla_target\":\"2 hours\"} The note is summarized above.", source: "service note: support is 24x7, escalations use pager, SLA target is 2 hours.", tags: ["json", "verbose"] }
        ]
      },
      {
        id: "meeting-summary-set",
        title: "Meeting Summary Set",
        task_type: "summarization",
        allowed_labels: ["concise"],
        description: "会议纪要摘要样本，用于检查压缩率和行动项保留情况。",
        samples: [
          { id: "sum-001", split: "train", label: "concise", instruction: "Summarize the meeting notes into a short action-focused recap.", response: "The team agreed to ship the revised onboarding flow next Friday, and engineering will confirm the final analytics events before release.", source: "meeting notes: shipping revised onboarding flow next Friday; engineering to confirm final analytics events.", tags: ["summary", "good"] },
          { id: "sum-002", split: "train", label: "concise", instruction: "Summarize the meeting notes into a short action-focused recap.", response: "The team discussed the onboarding flow, the analytics schema, the QA checklist, the release risk matrix, the customer communication plan, and the follow-up review schedule in detail.", source: "meeting notes: shipping revised onboarding flow next Friday; engineering to confirm final analytics events.", tags: ["summary", "too_long"] },
          { id: "sum-003", split: "valid", label: "concise", instruction: "Summarize the architecture review in one paragraph.", response: "The review confirmed the cache layer should be split from the API service, and the team will prototype the new boundary before the next demo.", source: "", tags: ["missing_source"] },
          { id: "sum-004", split: "test", label: "concise", instruction: "Summarize the meeting notes into a short action-focused recap.", response: "The team agreed to ship the revised onboarding flow next Friday, and engineering will confirm the final analytics events before release.", source: "meeting notes: shipping revised onboarding flow next Friday; engineering to confirm final analytics events.", tags: ["duplicate", "leakage"] },
          { id: "sum-005", split: "test", label: "concise", instruction: "Summarize the roadmap discussion with action items only.", response: "Action items: lock the Q3 launch scope, draft the partner brief, and schedule a design review.", source: "roadmap discussion: lock Q3 scope, draft partner brief, schedule design review.", tags: ["good"] }
        ]
      },
      {
        id: "intent-classification-pack",
        title: "Intent Classification Pack",
        task_type: "classification",
        allowed_labels: ["billing", "technical", "account", "sales"],
        description: "用户意图分类样本，用于检查标签一致性和跨 split 泄漏。",
        samples: [
          { id: "cls-001", split: "train", label: "billing", instruction: "My latest subscription charge looks wrong.", response: "billing", source: "labeled by support triage team after manual review.", tags: ["billing"] },
          { id: "cls-002", split: "train", label: "technical", instruction: "The dashboard keeps crashing when I open reports.", response: "account", source: "labeled by support triage team after manual review.", tags: ["mismatch"] },
          { id: "cls-003", split: "valid", label: "account", instruction: "I need to change the email address on my profile.", response: "account", source: "labeled by support triage team after manual review.", tags: ["account"] },
          { id: "cls-004", split: "test", label: "sales", instruction: "Can someone explain the enterprise plan pricing?", response: "sales, billing", source: "labeled by support triage team after manual review.", tags: ["ambiguous"] },
          { id: "cls-005", split: "test", label: "billing", instruction: "My latest subscription charge looks wrong.", response: "billing", source: "labeled by support triage team after manual review.", tags: ["duplicate", "leakage"] }
        ]
      }
    ];

    const STOPWORDS = new Set(["the","and","or","a","an","to","of","in","on","for","my","i","you","is","are","be","can","do","does","how","what","if","please"]);
    const REFUSAL_HINTS = ["cannot", "can not", "can't", "无法", "不能", "不可以", "不便", "拒绝", "抱歉"];
    const TOKEN_RE = /[a-zA-Z0-9_]+|[\u4e00-\u9fff]/g;

    function normalizeText(text) {
      return (text || "").toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, " ").replace(/\s+/g, " ").trim();
    }

    function tokenize(text) {
      return [...normalizeText(text).matchAll(/[a-zA-Z0-9_]+|[\u4e00-\u9fff]/g)].map(match => match[0]).filter(token => !STOPWORDS.has(token));
    }

    function jaccard(left, right) {
      const a = new Set(tokenize(left));
      const b = new Set(tokenize(right));
      if (!a.size && !b.size) return 1;
      const union = new Set([...a, ...b]);
      let inter = 0;
      a.forEach(token => { if (b.has(token)) inter += 1; });
      return union.size ? inter / union.size : 0;
    }

    function responseIsRefusal(text) {
      const lowered = (text || "").toLowerCase();
      return REFUSAL_HINTS.some(hint => lowered.includes(hint));
    }

    function responseIsJsonLike(text) {
      const trimmed = (text || "").trim();
      return trimmed.startsWith("{") && trimmed.endsWith("}") && trimmed.includes(":");
    }

    function responseLabels(text) {
      return normalizeText(text).split(/[\s,|/;]+/).filter(Boolean);
    }

    function formatScore(sample, dataset) {
      const taskType = dataset.task_type;
      const response = (sample.response || "").trim();
      const label = (sample.label || "").toLowerCase();
      const allowed = (dataset.allowed_labels || []).map(item => item.toLowerCase());

      if (taskType === "qa") {
        if (label === "answerable") return responseIsRefusal(response) ? 0.15 : (response ? 1 : 0);
        if (label === "abstain") return responseIsRefusal(response) ? 1 : 0.2;
      }
      if (taskType === "extraction") {
        if (responseIsJsonLike(response)) return response.count("{") === 1 && response.count("}") === 1 ? 1 : 0.75;
        if (response.includes(":") && (response.includes("\n") || response.startsWith("-"))) return 0.45;
        return 0.1;
      }
      if (taskType === "summarization") {
        const ratio = response.length / Math.max(sample.instruction.length, 1);
        if (ratio > 1) return 0.25;
        if (ratio >= 0.18 && ratio <= 0.75) return 1;
        if (ratio < 0.12) return 0.35;
        return 0.7;
      }
      if (taskType === "classification") {
        const parsed = responseLabels(response);
        if (parsed.length === 1 && parsed[0] === label) return 1;
        if (parsed.length === 1 && allowed.includes(parsed[0])) return 0.55;
        return parsed.length ? 0.25 : 0;
      }
      return 0.5;
    }

    function lengthScore(sample, dataset) {
      const ratio = sample.response.length / Math.max(sample.instruction.length, 1);
      const taskType = dataset.task_type;
      if (taskType === "qa") {
        if (ratio >= 0.25 && ratio <= 1.05) return 1;
        if (ratio < 0.16) return 0.4;
        return 0.7;
      }
      if (taskType === "extraction") {
        if (responseIsJsonLike(sample.response)) return ratio >= 0.2 && ratio <= 1.3 ? 1 : 0.75;
        if (ratio >= 0.15 && ratio <= 1) return 0.55;
        return 0.25;
      }
      if (taskType === "summarization") {
        if (ratio >= 0.18 && ratio <= 0.7) return 1;
        if (ratio > 1) return 0.2;
        if (ratio < 0.12) return 0.35;
        return 0.7;
      }
      if (taskType === "classification") {
        if (sample.response.length <= 20) return 1;
        if (sample.response.length <= 40) return 0.6;
        return 0.2;
      }
      return 0.5;
    }

    function supportScore(sample) {
      if (!sample.source || !sample.source.trim()) return 0;
      return Number((0.7 * jaccard(sample.response, sample.source) + 0.3 * jaccard(sample.response, sample.instruction)).toFixed(4));
    }

    function buildGroups(samples, threshold = 0.88) {
      const parent = new Map(samples.map(sample => [sample.id, sample.id]));
      const find = node => {
        while (parent.get(node) !== node) {
          parent.set(node, parent.get(parent.get(node)));
          node = parent.get(node);
        }
        return node;
      };
      const union = (left, right) => {
        const rootLeft = find(left);
        const rootRight = find(right);
        if (rootLeft !== rootRight) parent.set(rootRight, rootLeft);
      };
      for (let i = 0; i < samples.length; i += 1) {
        for (let j = i + 1; j < samples.length; j += 1) {
          if (jaccard(samples[i].instruction, samples[j].instruction) >= threshold) union(samples[i].id, samples[j].id);
        }
      }
      const groups = new Map();
      samples.forEach(sample => {
        const root = find(sample.id);
        if (!groups.has(root)) groups.set(root, []);
        groups.get(root).push(sample.id);
      });
      return [...groups.values()].filter(group => group.length > 1);
    }

    function buildLeakage(samples, threshold = 0.9) {
      const pairs = [];
      for (let i = 0; i < samples.length; i += 1) {
        for (let j = i + 1; j < samples.length; j += 1) {
          const left = samples[i];
          const right = samples[j];
          if (left.split === right.split) continue;
          const sim = jaccard(left.instruction, right.instruction);
          if (sim >= threshold) {
            pairs.push({ left_id: left.id, right_id: right.id, left_split: left.split, right_split: right.split, similarity: Number(sim.toFixed(4)) });
          }
        }
      }
      return pairs;
    }

    function reviewIssues(sample, dataset, duplicateGroups, leakagePairs) {
      const issues = [];
      const source = (sample.source || "").trim();
      const label = (sample.label || "").toLowerCase();
      const allowed = (dataset.allowed_labels || []).map(item => item.toLowerCase());
      const duplicate = duplicateGroups.some(group => group.includes(sample.id));
      const leakage = leakagePairs.some(pair => pair.left_id === sample.id || pair.right_id === sample.id);

      if (!source) issues.push({ severity: "high", type: "missing_source", message: "缺少可追溯来源。" });
      if (duplicate) issues.push({ severity: "medium", type: "duplicate_sample", message: "存在重复或近似重复样本。" });
      if (leakage) issues.push({ severity: "high", type: "split_leakage", message: "样本与其他 split 的内容高度相似。" });

      if (dataset.task_type === "qa") {
        if (label === "answerable" && responseIsRefusal(sample.response)) issues.push({ severity: "high", type: "over_refusal", message: "应回答却出现了拒答。" });
        if (label === "abstain" && !responseIsRefusal(sample.response)) issues.push({ severity: "high", type: "refusal_missing", message: "应拒答却给出了实质答案。" });
      } else if (dataset.task_type === "extraction") {
        if (!responseIsJsonLike(sample.response)) issues.push({ severity: "medium", type: "format_mismatch", message: "抽取结果应保持 JSON 结构。" });
      } else if (dataset.task_type === "summarization") {
        const ratio = sample.response.length / Math.max(sample.instruction.length, 1);
        if (ratio > 1) issues.push({ severity: "medium", type: "too_long", message: "摘要过长，压缩率不足。" });
        if (ratio < 0.12) issues.push({ severity: "medium", type: "too_short", message: "摘要过短，信息压缩过头。" });
      } else if (dataset.task_type === "classification") {
        const parsed = responseLabels(sample.response);
        if (parsed.length !== 1 || !allowed.includes(parsed[0])) {
          issues.push({ severity: "high", type: "label_mismatch", message: "分类标签不唯一或不在允许集合内。" });
        } else if (parsed[0] !== label) {
          issues.push({ severity: "medium", type: "label_swap", message: "预测标签与样本标签不一致。" });
        }
      }

      const support = supportScore(sample);
      if (source && support < 0.15) issues.push({ severity: "medium", type: "weak_support", message: "响应与来源材料重合度偏低。" });
      return issues;
    }

    function sampleReport(sample, dataset, duplicateGroups, leakagePairs) {
      const duplicate = duplicateGroups.some(group => group.includes(sample.id));
      const leakage = leakagePairs.some(pair => pair.left_id === sample.id || pair.right_id === sample.id);
      const format = formatScore(sample, dataset);
      const length = lengthScore(sample, dataset);
      const sourceCoverage = sample.source && sample.source.trim() ? 1 : 0;
      const support = supportScore(sample);
      const issues = reviewIssues(sample, dataset, duplicateGroups, leakagePairs);
      let overall = 0.32 * format + 0.24 * sourceCoverage + 0.18 * length + 0.16 * support;
      if (duplicate) overall -= 0.07;
      if (leakage) overall -= 0.11;
      overall = Math.max(0, Math.min(1, Number(overall.toFixed(4))));
      return {
        ...sample,
        task_type: dataset.task_type,
        metrics: {
          format_fit: Number(format.toFixed(4)),
          length_fit: Number(length.toFixed(4)),
          source_coverage: sourceCoverage,
          support_score: support,
          overall
        },
        issues,
        duplicate,
        leakage
      };
    }

    function auditDataset(dataset) {
      const duplicateGroups = buildGroups(dataset.samples);
      const leakagePairs = buildLeakage(dataset.samples);
      const samples = dataset.samples.map(sample => sampleReport(sample, dataset, duplicateGroups, leakagePairs));
      const total = Math.max(samples.length, 1);
      const sourceCoverageRate = samples.reduce((sum, sample) => sum + sample.metrics.source_coverage, 0) / total;
      const formatPassRate = samples.filter(sample => sample.metrics.format_fit >= 0.7).length / total;
      const duplicateRate = samples.filter(sample => sample.duplicate).length / total;
      const leakageCount = leakagePairs.length;
      const averageQuality = samples.reduce((sum, sample) => sum + sample.metrics.overall, 0) / total;
      const highIssueCount = samples.reduce((sum, sample) => sum + sample.issues.filter(issue => issue.severity === "high").length, 0);
      const issueCounts = new Map();
      samples.forEach(sample => sample.issues.forEach(issue => issueCounts.set(issue.type, (issueCounts.get(issue.type) || 0) + 1)));
      const topIssues = [...issueCounts.entries()].sort((a, b) => b[1] - a[1]).map(([type, count]) => ({ type, count }));
      const recommendations = [];
      if (issueCounts.has("missing_source")) recommendations.push("补齐缺失来源的样本，并保留原始参考材料。");
      if (duplicateGroups.length) recommendations.push("合并重复或近似重复样本，避免训练集偏置。");
      if (leakagePairs.length) recommendations.push("重新分配跨 split 泄漏样本，确保训练和评测隔离。");
      if (issueCounts.has("format_mismatch") || issueCounts.has("label_mismatch")) recommendations.push("统一输出模板和标签规范，降低格式噪声。");
      if (!recommendations.length) recommendations.push("当前数据集结构稳定，可以继续扩充样本覆盖面。");
      const riskLevel = leakageCount || highIssueCount >= 3 ? "high" : (duplicateGroups.length || highIssueCount ? "medium" : "low");
      return {
        ...dataset,
        metrics: {
          sample_count: total,
          split_distribution: samples.reduce((acc, sample) => { acc[sample.split] = (acc[sample.split] || 0) + 1; return acc; }, {}),
          label_distribution: samples.reduce((acc, sample) => { acc[sample.label] = (acc[sample.label] || 0) + 1; return acc; }, {}),
          source_coverage_rate: Number(sourceCoverageRate.toFixed(4)),
          format_pass_rate: Number(formatPassRate.toFixed(4)),
          duplicate_rate: Number(duplicateRate.toFixed(4)),
          leakage_count: leakageCount,
          overall_quality: Number(averageQuality.toFixed(4)),
          risk_level: riskLevel
        },
        duplicate_groups: duplicateGroups,
        leakage_pairs: leakagePairs,
        top_issues: topIssues,
        recommendations,
        samples
      };
    }

    function auditAll() {
      const datasetsWithAudit = datasets.map(auditDataset);
      return {
        aggregate: {
          dataset_count: datasetsWithAudit.length,
          sample_count: datasetsWithAudit.reduce((sum, dataset) => sum + dataset.metrics.sample_count, 0),
          avg_quality: Number((datasetsWithAudit.reduce((sum, dataset) => sum + dataset.metrics.overall_quality, 0) / datasetsWithAudit.length).toFixed(4)),
          avg_source_coverage: Number((datasetsWithAudit.reduce((sum, dataset) => sum + dataset.metrics.source_coverage_rate, 0) / datasetsWithAudit.length).toFixed(4)),
          total_leakage: datasetsWithAudit.reduce((sum, dataset) => sum + dataset.metrics.leakage_count, 0),
          risky_datasets: datasetsWithAudit.filter(dataset => dataset.metrics.risk_level === "high").map(dataset => dataset.id)
        },
        datasets: datasetsWithAudit
      };
    }

    function badgeClass(score) {
      if (score >= 0.8) return "good";
      if (score >= 0.55) return "warn";
      return "bad";
    }

    function formatPct(value) {
      return `${Math.round(value * 100)}%`;
    }

    function scoreColor(score) {
      if (score >= 0.8) return "#1f8a61";
      if (score >= 0.55) return "#d9861f";
      return "#ca4747";
    }

    function drawChart(reports, selectedId) {
      const canvas = document.getElementById("qualityChart");
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, width, height);

      if (!reports.length) {
        ctx.fillStyle = "#637086";
        ctx.font = "700 18px Segoe UI";
        ctx.fillText("没有符合筛选条件的样本", 28, 56);
        return;
      }

      const max = Math.max(...reports.map(item => item.metrics.overall), 1);
      const margin = 34;
      const rowHeight = Math.min(54, (height - 80) / reports.length);
      reports.forEach((item, index) => {
        const y = 28 + index * rowHeight;
        const barWidth = (width - 220) * (item.metrics.overall / max);
        ctx.fillStyle = item.id === selectedId ? "#dce6ff" : "#eef2f7";
        ctx.fillRect(18, y - 3, width - 36, rowHeight - 10);
        ctx.fillStyle = scoreColor(item.metrics.overall);
        ctx.fillRect(170, y + 3, Math.max(barWidth, 4), 18);
        ctx.fillStyle = "#162032";
        ctx.font = "700 15px Segoe UI";
        ctx.fillText(item.id, 28, y + 18);
        ctx.fillStyle = "#637086";
        ctx.font = "12px Segoe UI";
        ctx.fillText(`${item.split} · ${item.label}`, 92, y + 18);
        ctx.fillStyle = "#162032";
        ctx.font = "700 14px Segoe UI";
        ctx.fillText(formatPct(item.metrics.overall), 182 + barWidth, y + 18);
      });
    }

    let selectedDatasetId = datasets[0].id;
    let selectedSplit = "all";
    let selectedSampleId = "";

    function currentDataset() {
      return datasets.find(item => item.id === selectedDatasetId) || datasets[0];
    }

    function currentAudit() {
      return auditDataset(currentDataset());
    }

    function visibleSamples(audit) {
      return audit.samples.filter(sample => selectedSplit === "all" || sample.split === selectedSplit);
    }

    function render() {
      const audit = currentAudit();
      const samples = visibleSamples(audit);
      if (!selectedSampleId || !samples.some(item => item.id === selectedSampleId)) {
        selectedSampleId = samples[0] ? samples[0].id : "";
      }
      const selectedSample = samples.find(item => item.id === selectedSampleId) || samples[0];

      const metrics = [
        ["样本数", audit.metrics.sample_count],
        ["总分", formatPct(audit.metrics.overall_quality)],
        ["来源覆盖", formatPct(audit.metrics.source_coverage_rate)],
        ["格式通过", formatPct(audit.metrics.format_pass_rate)],
        ["重复率", formatPct(audit.metrics.duplicate_rate)],
        ["泄漏", audit.metrics.leakage_count]
      ];
      document.getElementById("metrics").innerHTML = metrics.map(([label, value]) => `
        <div class="metric">
          <div class="label">${label}</div>
          <div class="value">${value}</div>
        </div>
      `).join("");

      drawChart(samples.slice().sort((a, b) => b.metrics.overall - a.metrics.overall), selectedSampleId);

      document.getElementById("issueList").innerHTML = [
        ...audit.top_issues.slice(0, 4).map(item => `
          <div class="issue ${item.count >= 2 ? "medium" : "low"}">
            <strong>${item.type}</strong>
            <div class="sample-sub">出现 ${item.count} 次</div>
          </div>
        `),
        ...audit.recommendations.map(text => `
          <div class="issue low"><strong>建议</strong><div class="sample-sub">${text}</div></div>
        `)
      ].join("") || "<p class=\"sample-sub\">没有明显问题。</p>";

      document.getElementById("sampleList").innerHTML = samples.map(sample => `
        <div class="sample-card ${sample.id === selectedSampleId ? "active" : ""}" data-sample-id="${sample.id}">
          <div>
            <span class="chip">${sample.split}</span>
          </div>
          <div>
            <span class="chip">${sample.label}</span>
          </div>
          <div>
            <div class="sample-title">${sample.instruction}</div>
            <div class="sample-sub">${sample.tags.join(" · ")}</div>
          </div>
          <div style="text-align:right">
            <span class="chip ${badgeClass(sample.metrics.overall)}">${formatPct(sample.metrics.overall)}</span>
          </div>
        </div>
      `).join("") || "<p class=\"sample-sub\">当前筛选下没有样本。</p>";

      document.querySelectorAll(".sample-card").forEach(card => {
        card.addEventListener("click", () => {
          selectedSampleId = card.dataset.sampleId;
          render();
        });
      });

      document.getElementById("detail").innerHTML = selectedSample ? `
        <div class="detail-block">
          <strong>${selectedSample.id}</strong>
          <p>${selectedSample.instruction}</p>
        </div>
        <div class="detail-block">
          <strong>Response</strong>
          <p>${selectedSample.response}</p>
        </div>
        <div class="detail-block">
          <strong>Source</strong>
          <p>${selectedSample.source || "无来源"}</p>
        </div>
        <div class="detail-block">
          <strong>Metrics</strong>
          <p>format_fit: ${formatPct(selectedSample.metrics.format_fit)}\nlength_fit: ${formatPct(selectedSample.metrics.length_fit)}\nsource_coverage: ${formatPct(selectedSample.metrics.source_coverage)}\nsupport_score: ${formatPct(selectedSample.metrics.support_score)}\noverall: ${formatPct(selectedSample.metrics.overall)}</p>
        </div>
        <div class="detail-block">
          <strong>Issues</strong>
          <ul class="compact-list">
            ${selectedSample.issues.length ? selectedSample.issues.map(issue => `<li>${issue.message}</li>`).join("") : "<li>未发现明显问题。</li>"}
          </ul>
        </div>
        <div class="detail-block">
          <strong>Duplicate / Leakage</strong>
          <p>${selectedSample.duplicate ? "belongs to a duplicate cluster" : "no duplicate cluster"}\n${selectedSample.leakage ? "cross split leakage detected" : "no leakage detected"}</p>
        </div>
      ` : "<p class=\"sample-sub\">没有可显示的样本。</p>";
    }

    function populateSelectors() {
      const datasetSelect = document.getElementById("datasetSelect");
      datasetSelect.innerHTML = datasets.map(dataset => `<option value="${dataset.id}">${dataset.title}</option>`).join("");
      datasetSelect.value = selectedDatasetId;
      datasetSelect.addEventListener("change", () => {
        selectedDatasetId = datasetSelect.value;
        selectedSampleId = "";
        render();
      });

      const splitSelect = document.getElementById("splitSelect");
      splitSelect.addEventListener("change", () => {
        selectedSplit = splitSelect.value;
        selectedSampleId = "";
        render();
      });
    }

    populateSelectors();
    render();
  </script>
</body>
</html>
