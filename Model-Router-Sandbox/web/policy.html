<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Model Router Sandbox 策略实验"><title>策略实验 | Model Router Sandbox</title><link rel="stylesheet" href="styles.css?v=6.0.0"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script src="app.js?v=6.0.0" defer></script></head>
<body data-page="policy"><header class="app-header"><div class="header-inner"><a class="brand" href="index.html"><span class="brand-mark"><i data-lucide="route"></i></span><span><strong>Model Router</strong><small>POLICY SANDBOX</small></span></a><nav class="main-nav" aria-label="主导航"><a href="index.html"><i data-lucide="layout-dashboard"></i><span>路由总览</span></a><a href="decision.html"><i data-lucide="git-compare-arrows"></i><span>决策解释</span></a><a href="models.html"><i data-lucide="boxes"></i><span>模型目录</span></a><a class="active" href="policy.html" aria-current="page"><i data-lucide="sliders-horizontal"></i><span>策略实验</span></a></nav><div class="header-meta"><span class="runtime-state"><i></i> POLICY ONLINE</span><a class="icon-button dark" href="../README.md" title="查看项目文档" aria-label="查看项目文档"><i data-lucide="file-text"></i></a></div></div></header>
<main class="page-shell"><section class="page-heading"><div><p class="eyebrow">POLICY LAB</p><h1>策略实验</h1><p>实时调整评分权重与任务约束</p></div><div class="heading-actions"><label class="select-control wide"><span>实验任务</span><select id="policyTaskSelect" aria-label="策略任务"></select></label><button class="button button-secondary" id="resetPolicy" type="button"><i data-lucide="rotate-ccw"></i><span>重置策略</span></button><button class="button button-primary" id="exportPolicy" type="button"><i data-lucide="download"></i><span>导出策略</span></button></div></section>
<section class="experiment-banner"><div><p>EXPERIMENT RESULT</p><strong id="experimentWinner">--</strong><span id="experimentSummary">--</span></div><div class="experiment-compare"><span>BASELINE</span><strong id="baselineWinner">--</strong></div></section>
<section class="policy-layout"><article class="panel controls-panel"><header class="panel-header"><div><p class="panel-kicker">WEIGHT CONTROLS</p><h2>评分权重</h2></div><span class="panel-note" id="weightTotal">100%</span></header><div class="weight-controls" id="weightControls"></div><div class="constraint-controls"><label><span>预算倍率 <b id="budgetMultiplierValue">1.0x</b></span><input id="budgetMultiplier" type="range" min="50" max="200" step="10" value="100"></label><label><span>最低质量调整 <b id="qualityAdjustmentValue">+0.00</b></span><input id="qualityAdjustment" type="range" min="-10" max="10" step="1" value="0"></label></div></article><article class="panel experiment-panel"><header class="panel-header"><div><p class="panel-kicker">LIVE RANKING</p><h2>实验排序</h2></div><span class="status-chip" id="experimentStatus">--</span></header><div class="experiment-ranking" id="experimentRanking"></div></article></section>
<section class="metric-grid metric-grid-four"><article class="metric-accent"><span>实验赢家</span><strong id="policyWinnerMetric">--</strong><small>MODEL</small></article><article><span>加权评分</span><strong id="policyScoreMetric">--</strong><small>TOTAL</small></article><article><span>预计成本</span><strong id="policyCostMetric">--</strong><small>USD</small></article><article class="metric-danger"><span>候选模型</span><strong id="policyCandidateMetric">--</strong><small>ACCEPTED</small></article></section>
<section class="panel policy-diff-panel"><header class="panel-header"><div><p class="panel-kicker">POLICY DIFF</p><h2>策略差异</h2></div><span class="panel-note">BASELINE VS EXPERIMENT</span></header><div class="policy-diff" id="policyDiff"></div></section></main><div class="toast" id="toast" role="status" aria-live="polite"></div></body></html>
