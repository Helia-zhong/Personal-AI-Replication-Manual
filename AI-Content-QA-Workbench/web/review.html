<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="AI Content QA Workbench 声明复核">
  <title>声明复核 | AI Content QA Workbench</title><link rel="stylesheet" href="styles.css?v=5.0.0"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script src="app.js?v=5.0.0" defer></script>
</head>
<body data-page="review">
  <header class="app-header"><div class="header-inner"><a class="brand" href="index.html"><span class="brand-mark"><i data-lucide="scan-text"></i></span><span><strong>Content QA</strong><small>AI REVIEW SYSTEM</small></span></a><nav class="main-nav" aria-label="主导航"><a href="index.html"><i data-lucide="layout-dashboard"></i><span>质量总览</span></a><a class="active" href="review.html" aria-current="page"><i data-lucide="list-checks"></i><span>声明复核</span></a><a href="sources.html"><i data-lucide="library"></i><span>证据库</span></a><a href="report.html"><i data-lucide="file-chart-column"></i><span>发布报告</span></a></nav><div class="header-meta"><span class="runtime-state"><i></i> RULESET ACTIVE</span><a class="icon-button dark" href="../README.md" title="查看项目文档" aria-label="查看项目文档"><i data-lucide="file-text"></i></a></div></div></header>
  <main class="page-shell">
    <section class="page-heading"><div><p class="eyebrow">CLAIM REVIEW</p><h1>声明复核</h1><p id="reviewSubtitle">--</p></div><div class="heading-actions"><label class="select-control wide"><span>内容</span><select id="reviewSampleSelect" aria-label="选择内容"></select></label><button class="button button-secondary" id="resetDispositions" type="button"><i data-lucide="rotate-ccw"></i><span>重置处置</span></button></div></section>
    <section class="document-banner"><div><span id="reviewSampleId">--</span><strong id="reviewSampleTitle">--</strong></div><div><span class="status-chip" id="reviewRisk">--</span></div></section>
    <section class="metric-grid metric-grid-four"><article class="metric-accent"><span>声明</span><strong id="reviewClaimCount">--</strong><small>TOTAL</small></article><article><span>引用覆盖</span><strong id="reviewCoverage">--</strong><small>CITED</small></article><article><span>支持度</span><strong id="reviewSupport">--</strong><small>AVERAGE</small></article><article class="metric-danger"><span>问题</span><strong id="reviewIssueCount">--</strong><small>OPEN</small></article></section>
    <section class="review-layout"><article class="panel document-panel"><header class="panel-header"><div><p class="panel-kicker">CONTENT DOCUMENT</p><h2>待审内容</h2></div><span class="panel-note" id="documentLength">0 CHARS</span></header><div class="document-content" id="documentContent"></div></article><article class="panel queue-panel"><header class="panel-header"><div><p class="panel-kicker">CLAIM QUEUE</p><h2>声明队列</h2></div><span class="panel-note" id="claimQueueCount">0 CLAIMS</span></header><div class="claim-queue" id="claimQueue"></div></article></section>
    <section class="panel claim-inspector-panel"><header class="panel-header"><div><p class="panel-kicker">CLAIM INSPECTOR</p><h2 id="claimInspectorTitle">声明详情</h2></div><span class="status-chip" id="claimInspectorStatus">--</span></header><div class="claim-inspector" id="claimInspector"></div></section>
  </main><div class="toast" id="toast" role="status" aria-live="polite"></div>
</body></html>
