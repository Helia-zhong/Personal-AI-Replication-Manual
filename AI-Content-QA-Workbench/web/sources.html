<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="AI Content QA Workbench 证据库"><title>证据库 | AI Content QA Workbench</title><link rel="stylesheet" href="styles.css?v=5.0.0"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script src="app.js?v=5.0.0" defer></script></head>
<body data-page="sources"><header class="app-header"><div class="header-inner"><a class="brand" href="index.html"><span class="brand-mark"><i data-lucide="scan-text"></i></span><span><strong>Content QA</strong><small>AI REVIEW SYSTEM</small></span></a><nav class="main-nav" aria-label="主导航"><a href="index.html"><i data-lucide="layout-dashboard"></i><span>质量总览</span></a><a href="review.html"><i data-lucide="list-checks"></i><span>声明复核</span></a><a class="active" href="sources.html" aria-current="page"><i data-lucide="library"></i><span>证据库</span></a><a href="report.html"><i data-lucide="file-chart-column"></i><span>发布报告</span></a></nav><div class="header-meta"><span class="runtime-state"><i></i> RULESET ACTIVE</span><a class="icon-button dark" href="../README.md" title="查看项目文档" aria-label="查看项目文档"><i data-lucide="file-text"></i></a></div></div></header>
  <main class="page-shell"><section class="page-heading"><div><p class="eyebrow">EVIDENCE LIBRARY</p><h1>证据库</h1><p>9 份本地来源 · 9 条引用关系</p></div><div class="heading-actions"><label class="search-control"><i data-lucide="search"></i><input id="sourceSearch" type="search" placeholder="搜索来源标题或正文" aria-label="搜索来源"></label><label class="select-control"><span>内容</span><select id="sourceSampleFilter" aria-label="来源内容筛选"><option value="all">全部内容</option></select></label></div></section>
    <section class="metric-grid metric-grid-four"><article class="metric-accent"><span>来源文档</span><strong id="sourceCountMetric">--</strong><small>SOURCES</small></article><article><span>被引来源</span><strong id="citedSourceMetric">--</strong><small>REFERENCED</small></article><article><span>平均支持度</span><strong id="sourceSupportMetric">--</strong><small>CITED CLAIMS</small></article><article class="metric-danger"><span>无证据声明</span><strong id="uncitedClaimMetric">--</strong><small>CLAIMS</small></article></section>
    <section class="source-layout"><article class="panel source-list-panel"><header class="panel-header"><div><p class="panel-kicker">SOURCE INDEX</p><h2>来源列表</h2></div><span class="panel-note" id="sourceResultCount">0 SOURCES</span></header><div class="source-list" id="sourceList"></div></article><article class="panel source-detail-panel"><header class="panel-header"><div><p class="panel-kicker">SOURCE INSPECTOR</p><h2 id="sourceDetailTitle">来源详情</h2></div><span class="status-chip" id="sourceDetailStatus">--</span></header><div id="sourceDetail"></div></article></section>
    <section class="panel matrix-panel"><header class="panel-header"><div><p class="panel-kicker">EVIDENCE MATRIX</p><h2>声明与来源关系</h2></div><span class="panel-note">12 CLAIMS</span></header><div class="table-scroll"><table><thead><tr><th>内容 / 声明</th><th>引用</th><th>支持度</th><th>问题</th><th>状态</th></tr></thead><tbody id="evidenceRows"></tbody></table></div></section>
  </main><div class="toast" id="toast" role="status" aria-live="polite"></div></body></html>
