<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Content QA Workbench</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #657286;
      --line: #dae1eb;
      --panel: #ffffff;
      --bg: #f5f7fb;
      --green: #21845d;
      --blue: #2f66d0;
      --amber: #ce821c;
      --red: #c94a4a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    header {
      padding: 26px clamp(18px, 4vw, 48px) 18px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 3vw, 40px);
      line-height: 1.1;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.7;
      max-width: 780px;
    }

    select {
      min-height: 38px;
      min-width: 240px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      padding: 0 12px;
      font: inherit;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 22px auto 42px;
      display: grid;
      gap: 18px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 12px;
    }

    .metric,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 16px 34px rgba(43, 52, 80, 0.08);
    }

    .metric {
      padding: 14px;
      min-height: 92px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    .value {
      margin-top: 8px;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .panel {
      padding: 18px;
      min-width: 0;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .content-text {
      color: var(--muted);
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .claim-list,
    .source-list {
      display: grid;
      gap: 10px;
    }

    .claim,
    .source {
      border-radius: 7px;
      border-left: 4px solid var(--green);
      background: #f5fbf8;
      padding: 11px 12px;
      line-height: 1.6;
    }

    .claim.medium {
      border-color: var(--amber);
      background: #fff8ea;
    }

    .claim.high {
      border-color: var(--red);
      background: #fff1f1;
    }

    .claim.ok {
      border-color: var(--green);
    }

    .source {
      border-color: var(--blue);
      background: #f3f6ff;
    }

    .meta {
      color: var(--muted);
      margin-top: 5px;
      font-size: 13px;
    }

    .tag {
      display: inline-block;
      margin: 6px 6px 0 0;
      padding: 3px 7px;
      border-radius: 5px;
      background: #eef2f7;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 900px) {
      header,
      .grid {
        grid-template-columns: 1fr;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .metrics {
        grid-template-columns: 1fr;
      }

      select {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AI Content QA Workbench</h1>
      <p class="subtitle">AI 生成内容质检：检查声明、引用、数字来源、绝对化表达和来源匹配程度。</p>
    </div>
    <select id="sampleSelect"></select>
  </header>

  <main>
    <section class="metrics" id="metrics"></section>

    <section class="grid">
      <div class="panel">
        <h2>待检查内容</h2>
        <div class="content-text" id="content"></div>
      </div>
      <div class="panel">
        <h2>来源材料</h2>
        <div class="source-list" id="sources"></div>
      </div>
    </section>

    <section class="panel">
      <h2>声明审查</h2>
      <div class="claim-list" id="claims"></div>
    </section>
  </main>

  <script>
    const samples = [
      {
        id: "content-001",
        title: "企业知识助手上线说明",
        content: "企业知识助手已支持对内部制度、项目文档和 FAQ 的统一检索，并可在答案中附带来源引用 [S1]。系统默认保留近 30 天的脱敏查询日志，用于质量评估 [S2]。它可以回答所有业务问题并保证完全正确。遇到权限不足的资料时，助手会提示无法访问并记录审计事件 [S3]。",
        sources: [
          { id: "S1", title: "知识助手版本记录", text: "当前版本支持内部制度、项目文档和 FAQ 的统一检索。答案可以附带来源引用，便于用户回看原始资料。" },
          { id: "S2", title: "日志保留策略", text: "系统默认保留 30 天脱敏查询日志。日志用于质量评估，不包含原始敏感字段。" },
          { id: "S3", title: "访问控制说明", text: "用户请求超出权限范围时，助手应提示无法访问。系统会记录审计事件以支持安全复核。" }
        ]
      },
      {
        id: "content-002",
        title: "模型评估周报摘要",
        content: "本周评估覆盖 180 条问答样本和 60 条摘要样本 [S1]。结构化 Prompt 的 JSON 合规率达到 96.7%，比基础版本高 14.2 个百分点 [S2]。所有测试样本都没有任何幻觉风险。平均响应延迟约为 1.8 秒 [S3]。",
        sources: [
          { id: "S1", title: "评测样本统计", text: "本周评测集包含 180 条问答样本、60 条摘要样本和 30 条分类样本。" },
          { id: "S2", title: "Prompt 对比结果", text: "结构化 Prompt 的 JSON 合规率为 96.7%，基础版本为 82.5%，差值为 14.2 个百分点。" },
          { id: "S3", title: "服务性能记录", text: "评估期间平均响应延迟为 1.8 秒，P95 延迟为 3.4 秒。" }
        ]
      },
      {
        id: "content-003",
        title: "AI 客服流程说明",
        content: "AI 客服会先识别用户意图，再查询知识库和历史工单 [S1]。当问题涉及账号、合同或个人信息时，系统会要求用户完成身份校验 [S2]。如果知识库没有命中，AI 客服会自动编写最终答复。复杂问题可以转人工，并保留上下文摘要 [S3]。",
        sources: [
          { id: "S1", title: "客服意图识别流程", text: "客服流程包括意图识别、知识库检索、历史工单查询和结果生成。" },
          { id: "S2", title: "敏感信息处理规范", text: "账号、合同和个人信息相关问题需要先完成身份校验，未通过时不能输出敏感内容。" },
          { id: "S3", title: "人工转接规则", text: "复杂问题或低置信度问题可以转人工。系统应保留对话上下文摘要，帮助人工继续处理。" }
        ]
      }
    ];

    const absoluteTerms = ["所有", "任何", "完全", "永远", "一定", "保证", "零错误", "没有任何"];
    const stopwords = new Set(["的", "了", "和", "与", "或", "在", "是", "为", "并", "会", "可", "可以", "当"]);

    function tokenize(text) {
      return new Set((text.toLowerCase().match(/[a-z0-9_]+|[\u4e00-\u9fff]/g) || []).filter(token => !stopwords.has(token)));
    }

    function citations(claim) {
      return [...claim.matchAll(/\[([A-Za-z0-9_-]+)\]/g)].map(match => match[1]);
    }

    function support(claim, sources) {
      const claimTokens = tokenize(claim.replace(/\[[^\]]+\]/g, ""));
      if (!claimTokens.size || !sources.length) return 0;
      const sourceTokens = sources.reduce((set, source) => {
        tokenize(`${source.title} ${source.text}`).forEach(token => set.add(token));
        return set;
      }, new Set());
      let hits = 0;
      claimTokens.forEach(token => { if (sourceTokens.has(token)) hits += 1; });
      return hits / claimTokens.size;
    }

    function audit(sample) {
      const sourceMap = new Map(sample.sources.map(source => [source.id, source]));
      const claims = sample.content.split(/(?<=[。！？!?])\s*/).filter(text => text.trim().length >= 8).map(claim => {
        const ids = citations(claim);
        const foundSources = ids.map(id => sourceMap.get(id)).filter(Boolean);
        const score = support(claim, foundSources);
        const issues = [];
        if (!ids.length) issues.push(["medium", "声明缺少来源引用。"]);
        if (/\d+(?:\.\d+)?%?|\d+\s*(?:天|秒|条|个|次)/.test(claim) && !ids.length) issues.push(["high", "数字声明需要可追溯来源。"]);
        if (absoluteTerms.some(term => claim.includes(term))) issues.push(["medium", "存在绝对化表达，建议改为有边界的描述。"]);
        if (ids.length && score < 0.2) issues.push(["medium", "引用来源与声明匹配不足。"]);
        if (ids.length !== foundSources.length) issues.push(["high", "存在无法匹配的引用 ID。"]);
        const severity = issues.some(issue => issue[0] === "high") ? "high" : issues.length ? "medium" : "ok";
        return { claim, ids, score, issues, severity };
      });
      const cited = claims.filter(claim => claim.ids.length).length;
      const issueCount = claims.reduce((sum, claim) => sum + claim.issues.length, 0);
      const averageSupport = claims.reduce((sum, claim) => sum + claim.score, 0) / Math.max(cited, 1);
      const risk = claims.some(claim => claim.severity === "high") ? "high" : issueCount >= 2 ? "medium" : issueCount ? "low" : "ok";
      return { claims, cited, issueCount, averageSupport, risk };
    }

    function pct(value) {
      return `${Math.round(value * 100)}%`;
    }

    function render() {
      const sample = samples.find(item => item.id === document.getElementById("sampleSelect").value) || samples[0];
      const result = audit(sample);
      const citationCoverage = result.cited / result.claims.length;
      const metrics = [
        ["声明数", result.claims.length],
        ["引用覆盖", pct(citationCoverage)],
        ["平均支持度", pct(result.averageSupport)],
        ["风险等级", result.risk]
      ];
      document.getElementById("metrics").innerHTML = metrics.map(([label, value]) => `
        <div class="metric">
          <div class="label">${label}</div>
          <div class="value">${value}</div>
        </div>
      `).join("");
      document.getElementById("content").textContent = sample.content;
      document.getElementById("sources").innerHTML = sample.sources.map(source => `
        <div class="source">
          <strong>${source.id} · ${source.title}</strong>
          <div class="meta">${source.text}</div>
        </div>
      `).join("");
      document.getElementById("claims").innerHTML = result.claims.map(item => `
        <div class="claim ${item.severity}">
          <strong>${item.claim}</strong>
          <div class="meta">引用：${item.ids.length ? item.ids.join(", ") : "无"} · 支持度：${pct(item.score)}</div>
          ${item.issues.map(issue => `<span class="tag">${issue[1]}</span>`).join("") || "<span class=\"tag\">未发现明显问题</span>"}
        </div>
      `).join("");
    }

    const select = document.getElementById("sampleSelect");
    select.innerHTML = samples.map(sample => `<option value="${sample.id}">${sample.title}</option>`).join("");
    select.addEventListener("change", render);
    render();
  </script>
</body>
</html>
