name: Content QA checks

on:
  push:
    paths:
      - 'AI-Content-QA-Workbench/**'
      - '.github/workflows/content-qa-tests.yml'
  pull_request:
    paths:
      - 'AI-Content-QA-Workbench/**'
      - '.github/workflows/content-qa-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-Content-QA-Workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s backend -p 'test_*.py' -v
      - run: node --test tests/data.test.cjs
      - run: node --check web/app.js
      - run: python scripts/audit_content.py --input data/content_samples.json --output audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: content-qa-audit
          path: AI-Content-QA-Workbench/audit.json
