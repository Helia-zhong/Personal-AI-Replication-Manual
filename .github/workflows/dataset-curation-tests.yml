name: Dataset Curation checks

on:
  push:
    paths:
      - "AI-Dataset-Curation-Lab/**"
      - ".github/workflows/dataset-curation-tests.yml"
  pull_request:
    paths:
      - "AI-Dataset-Curation-Lab/**"
      - ".github/workflows/dataset-curation-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-Dataset-Curation-Lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/requirements.txt
      - run: cd backend && python -m unittest discover -s . -p 'test_*.py' -v
