name: PromptOps checks

on:
  push:
    paths:
      - 'PromptOps-Evaluation-Lab/**'
      - '.github/workflows/promptops-tests.yml'
  pull_request:
    paths:
      - 'PromptOps-Evaluation-Lab/**'
      - '.github/workflows/promptops-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PromptOps-Evaluation-Lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend -p 'test_*.py' -v
      - run: python scripts/run_eval.py --compare --output reports/compare.json
      - run: python -m compileall -q backend scripts
