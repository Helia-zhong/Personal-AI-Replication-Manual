name: Model Router checks

on:
  push:
    paths:
      - 'Model-Router-Sandbox/**'
      - '.github/workflows/model-router-tests.yml'
  pull_request:
    paths:
      - 'Model-Router-Sandbox/**'
      - '.github/workflows/model-router-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Model-Router-Sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s backend -p 'test_*.py' -v
      - run: node --check web/app.js
      - run: python scripts/route_tasks.py > route-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: model-router-report
          path: Model-Router-Sandbox/route-report.json
