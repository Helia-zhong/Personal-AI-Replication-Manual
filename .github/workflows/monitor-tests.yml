name: Agent Monitor checks

on:
  push:
    paths:
      - 'Agent-Run-Monitor/**'
      - 'RAG-Evaluation-Studio/backend/**'
      - '.github/workflows/monitor-tests.yml'
  pull_request:
    paths:
      - 'Agent-Run-Monitor/**'
      - 'RAG-Evaluation-Studio/backend/**'
      - '.github/workflows/monitor-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Agent-Run-Monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s backend -p 'test_*.py' -v
      - run: node --test tests/data.test.cjs
      - run: node --check web/app.js
      - run: python scripts/capture_rag.py --inject-failure --output .monitor/ci-trace.json
      - run: python scripts/analyze_runs.py --input .monitor/ci-trace.json --output .monitor/ci-analysis.json
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-validation
          path: Agent-Run-Monitor/.monitor/ci-*.json
