name: RAG Studio checks

on:
  push:
    paths:
      - 'RAG-Evaluation-Studio/**'
      - '.github/workflows/rag-studio-tests.yml'
  pull_request:
    paths:
      - 'RAG-Evaluation-Studio/**'
      - '.github/workflows/rag-studio-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RAG-Evaluation-Studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend -p 'test_*.py' -v
      - run: python scripts/run_eval.py --top-k 3 --output reports/baseline.json
      - run: python -m compileall -q backend scripts
