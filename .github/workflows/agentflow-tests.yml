name: AgentFlow checks

on:
  push:
    paths:
      - 'AgentFlow-Visualizer/**'
      - '.github/workflows/agentflow-tests.yml'
  pull_request:
    paths:
      - 'AgentFlow-Visualizer/**'
      - '.github/workflows/agentflow-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgentFlow-Visualizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: AgentFlow-Visualizer/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm ci
      - run: npm test
      - run: python scripts/check_workflow.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentflow-verification
          path: |
            AgentFlow-Visualizer/test-results
            AgentFlow-Visualizer/docs/validation-results.json
