<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG Evaluation Studio</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #617084;
      --line: #d8e0ea;
      --panel: #ffffff;
      --bg: #f4f7fb;
      --teal: #0f9b8e;
      --blue: #315fdc;
      --orange: #e0782f;
      --red: #c74646;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      padding: 28px clamp(18px, 4vw, 48px) 20px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 3vw, 42px);
      line-height: 1.08;
    }

    .subtitle {
      margin: 8px 0 0;
      max-width: 780px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    select,
    input,
    button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    select,
    input {
      padding: 0 12px;
    }

    button {
      padding: 0 14px;
      cursor: pointer;
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 24px auto 42px;
      display: grid;
      gap: 18px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 12px;
    }

    .metric,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 16px 34px rgba(40, 54, 82, 0.08);
    }

    .metric {
      padding: 14px;
      min-height: 92px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    .value {
      margin-top: 8px;
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
    }

    .panel {
      padding: 18px;
      min-width: 0;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    canvas {
      width: 100%;
      height: 280px;
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      padding: 11px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 700;
    }

    .score {
      font-weight: 800;
      color: var(--blue);
      white-space: nowrap;
    }

    .doc-list {
      display: grid;
      gap: 10px;
    }

    .doc {
      border-left: 4px solid var(--teal);
      padding: 8px 10px;
      background: #f7fbfa;
      border-radius: 6px;
    }

    .doc strong {
      display: block;
      margin-bottom: 4px;
    }

    .doc p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .query-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      margin-bottom: 12px;
    }

    .query-row input {
      width: 100%;
    }

    .answer {
      margin: 0;
      line-height: 1.75;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      header,
      .grid {
        grid-template-columns: 1fr;
      }

      .toolbar {
        justify-content: flex-start;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .metrics {
        grid-template-columns: 1fr;
      }

      .query-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>RAG Evaluation Studio</h1>
      <p class="subtitle">检索增强生成评估工作台：用固定知识库和评测问题观察召回、引用、答案覆盖与风险提示。</p>
    </div>
    <div class="toolbar">
      <label for="topK">Top-K</label>
      <select id="topK">
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4</option>
      </select>
    </div>
  </header>

  <main>
    <section class="metrics" id="metrics"></section>

    <section class="grid">
      <div class="panel">
        <h2>评测用例表现</h2>
        <canvas id="chart" width="920" height="360"></canvas>
      </div>
      <div class="panel">
        <h2>自由检索</h2>
        <div class="query-row">
          <input id="queryInput" value="如何避免 RAG 答案编造并保留引用？">
          <button id="queryButton">检索</button>
        </div>
        <p class="answer" id="answer"></p>
        <div class="doc-list" id="docs"></div>
      </div>
    </section>

    <section class="panel">
      <h2>评测明细</h2>
      <table>
        <thead>
          <tr>
            <th>问题</th>
            <th>期望引用</th>
            <th>Top 命中</th>
            <th>覆盖率</th>
            <th>综合</th>
          </tr>
        </thead>
        <tbody id="caseTable"></tbody>
      </table>
    </section>
  </main>

  <script>
    const corpus = [
      { id: "kb-001", title: "知识库切片策略", category: "retrieval", text: "面向企业知识问答的 RAG 系统应优先使用语义完整的切片。每个 chunk 保留标题、章节、更新时间和来源链接。切片长度建议控制在 350 到 700 个中文字符，过短会丢失上下文，过长会降低检索精度。对于流程、规范和 FAQ，可以按问题或步骤拆分。" },
      { id: "kb-002", title: "引用答案生成规范", category: "generation", text: "RAG 答案应先判断检索材料是否足够，再生成结论。答案必须引用支持性来源，引用格式使用文档 ID。若检索片段没有覆盖问题关键点，应明确提示信息不足，避免编造。摘要型答案应把结论、依据和下一步操作分开呈现。" },
      { id: "kb-003", title: "权限与隐私处理", category: "governance", text: "知识库检索需要遵守权限边界。用户只能检索自己有权访问的文档。日志中不应保存原始敏感信息，可以保留脱敏后的查询、命中文档 ID、评分和耗时。涉及个人信息、合同金额或内部策略时，应进行访问控制和审计记录。" },
      { id: "kb-004", title: "Embedding 与重排", category: "retrieval", text: "检索链路可以采用关键词召回、向量召回和重排模型组合。Embedding 适合语义相近但字面不同的问题，BM25 适合精确术语匹配。reranker 用于对候选片段重新排序，通常能提升 Top-3 引用质量，但会增加延迟和成本。" },
      { id: "kb-005", title: "人工反馈闭环", category: "evaluation", text: "RAG 系统上线后需要记录用户反馈、低分答案和未命中问题。人工标注可以补充正确引用、答案要点和错误类型。定期把这些样本加入评测集，可以观察召回率、答案覆盖率和幻觉风险是否改善。" },
      { id: "kb-006", title: "RAG 评估指标", category: "evaluation", text: "常用 RAG 评估指标包括检索召回率、引用精度、答案相关性、事实一致性、拒答准确性和端到端延迟。评估时应把检索质量和生成质量分开记录。对于高风险业务，引用缺失或来源不匹配应触发人工复核。" }
    ];

    const cases = [
      { id: "rag-001", question: "RAG 知识库切片为什么不能太短或太长？", expected_doc_ids: ["kb-001"], expected_terms: ["语义完整", "上下文", "检索精度"] },
      { id: "rag-002", question: "如果检索材料没有覆盖问题关键点，答案应该怎么处理？", expected_doc_ids: ["kb-002"], expected_terms: ["信息不足", "避免编造", "引用"] },
      { id: "rag-003", question: "RAG 系统怎样处理用户权限和敏感日志？", expected_doc_ids: ["kb-003"], expected_terms: ["权限边界", "脱敏", "审计记录"] },
      { id: "rag-004", question: "Embedding、BM25 和 reranker 分别适合什么场景？", expected_doc_ids: ["kb-004"], expected_terms: ["语义相近", "精确术语", "重新排序"] },
      { id: "rag-005", question: "上线后的 RAG 系统如何通过人工反馈持续改进？", expected_doc_ids: ["kb-005", "kb-006"], expected_terms: ["用户反馈", "评测集", "召回率", "人工复核"] }
    ];

    const stopwords = new Set(["的", "了", "和", "与", "或", "应", "在", "是", "为", "及", "把", "对", "如何", "什么"]);

    function tokenize(text) {
      return (text.toLowerCase().match(/[a-z0-9_]+|[\u4e00-\u9fff]/g) || []).filter(token => !stopwords.has(token));
    }

    function score(question, doc) {
      const query = new Set(tokenize(question));
      const tokens = tokenize(`${doc.title} ${doc.category} ${doc.text}`);
      const counts = tokens.reduce((map, token) => map.set(token, (map.get(token) || 0) + 1), new Map());
      let value = 0;
      query.forEach(token => {
        if (counts.has(token)) value += 1 + Math.log(1 + counts.get(token));
      });
      return Number(value.toFixed(4));
    }

    function snippet(question, text) {
      const query = new Set(tokenize(question));
      const sentences = text.split(/(?<=[。！？.!?])\s*/).filter(Boolean);
      return sentences.sort((a, b) => overlap(query, b) - overlap(query, a))[0] || text.slice(0, 120);
    }

    function overlap(query, text) {
      const tokens = new Set(tokenize(text));
      let hits = 0;
      query.forEach(token => { if (tokens.has(token)) hits += 1; });
      return hits;
    }

    function retrieve(question, topK) {
      return corpus
        .map(doc => ({ ...doc, score: score(question, doc), snippet: snippet(question, doc.text) }))
        .sort((a, b) => b.score - a.score)
        .slice(0, topK);
    }

    function answer(question, docs) {
      if (!docs.length || docs[0].score <= 0) return "检索材料不足，暂不能给出可靠答案。";
      return `根据 ${docs[0].title}，可以先回答：${docs.slice(0, 2).map(doc => `${doc.snippet} [${doc.id}]`).join("；")}`;
    }

    function evaluate(topK) {
      return cases.map(item => {
        const docs = retrieve(item.question, topK);
        const ids = docs.map(doc => doc.id);
        const expected = new Set(item.expected_doc_ids);
        const hits = ids.filter(id => expected.has(id));
        const text = answer(item.question, docs).toLowerCase();
        const keywordHits = item.expected_terms.filter(term => text.includes(term.toLowerCase()));
        const citationRecall = hits.length / item.expected_doc_ids.length;
        const citationPrecision = hits.length / ids.length;
        const keywordCoverage = keywordHits.length / item.expected_terms.length;
        const topHit = expected.has(ids[0]) ? 1 : 0;
        const overall = 0.35 * citationRecall + 0.2 * citationPrecision + 0.3 * keywordCoverage + 0.15 * topHit;
        return { ...item, docs, topHit, citationRecall, citationPrecision, keywordCoverage, overall };
      });
    }

    function pct(value) {
      return `${Math.round(value * 100)}%`;
    }

    function drawChart(results) {
      const canvas = document.getElementById("chart");
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "#d8e0ea";
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i += 1) {
        const y = 32 + i * 65;
        ctx.beginPath();
        ctx.moveTo(52, y);
        ctx.lineTo(width - 24, y);
        ctx.stroke();
      }
      const barWidth = 72;
      const gap = (width - 100 - results.length * barWidth) / Math.max(results.length - 1, 1);
      results.forEach((item, index) => {
        const x = 58 + index * (barWidth + gap);
        const h = item.overall * 260;
        ctx.fillStyle = item.overall > 0.82 ? "#0f9b8e" : item.overall > 0.65 ? "#e0782f" : "#c74646";
        ctx.fillRect(x, height - 42 - h, barWidth, h);
        ctx.fillStyle = "#172033";
        ctx.font = "700 18px Segoe UI";
        ctx.fillText(pct(item.overall), x + 8, height - 50 - h);
        ctx.fillStyle = "#617084";
        ctx.font = "12px Segoe UI";
        ctx.fillText(item.id, x + 12, height - 18);
      });
    }

    function render() {
      const topK = Number(document.getElementById("topK").value);
      const results = evaluate(topK);
      const aggregate = ["topHit", "citationRecall", "citationPrecision", "keywordCoverage", "overall"].map(key =>
        results.reduce((sum, item) => sum + item[key], 0) / results.length
      );
      const labels = ["Top 命中", "引用召回", "引用精度", "关键词覆盖", "综合评分"];
      document.getElementById("metrics").innerHTML = labels.map((label, index) => `
        <div class="metric">
          <div class="label">${label}</div>
          <div class="value">${pct(aggregate[index])}</div>
        </div>
      `).join("");

      document.getElementById("caseTable").innerHTML = results.map(item => `
        <tr>
          <td>${item.question}</td>
          <td>${item.expected_doc_ids.join(", ")}</td>
          <td>${item.topHit ? "是" : "否"}</td>
          <td>${pct(item.keywordCoverage)}</td>
          <td class="score">${pct(item.overall)}</td>
        </tr>
      `).join("");
      drawChart(results);
      runQuery();
    }

    function runQuery() {
      const topK = Number(document.getElementById("topK").value);
      const q = document.getElementById("queryInput").value.trim();
      const docs = retrieve(q, topK);
      document.getElementById("answer").textContent = answer(q, docs);
      document.getElementById("docs").innerHTML = docs.map(doc => `
        <div class="doc">
          <strong>${doc.id} · ${doc.title} · ${doc.score.toFixed(2)}</strong>
          <p>${doc.snippet}</p>
        </div>
      `).join("");
    }

    document.getElementById("topK").addEventListener("change", render);
    document.getElementById("queryButton").addEventListener("click", runQuery);
    document.getElementById("queryInput").addEventListener("keydown", event => {
      if (event.key === "Enter") runQuery();
    });
    render();
  </script>
</body>
</html>
