<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RAG Evaluation Studio 检索工作台">
  <title>检索工作台 | RAG Evaluation Studio</title>
  <link rel="stylesheet" href="styles.css?v=3.0.2">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="app.js?v=3.0.2" defer></script>
</head>
<body data-page="query">
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="index.html"><span class="brand-symbol"><i data-lucide="blocks"></i></span><span><strong>RAG Studio</strong><small>EVALUATION SYSTEM</small></span></a>
      <nav class="main-nav" aria-label="主导航">
        <a class="active" href="index.html" aria-current="page"><i data-lucide="scan-search"></i><span>检索工作台</span></a>
        <a href="evaluation.html"><i data-lucide="flask-conical"></i><span>评测运行</span></a>
        <a href="corpus.html"><i data-lucide="library"></i><span>知识库</span></a>
        <a href="reports.html"><i data-lucide="chart-spline"></i><span>实验报告</span></a>
      </nav>
      <div class="header-meta"><span class="runtime-state"><i></i> INDEX READY</span><a class="icon-button dark" href="../README.md" title="查看项目文档" aria-label="查看项目文档"><i data-lucide="file-text"></i></a></div>
    </div>
  </header>

  <main class="page-shell">
    <section class="page-heading">
      <div><p class="eyebrow">RETRIEVAL PLAYGROUND</p><h1>检索工作台</h1><p>输入问题，检查分词、BM25 排序、候选片段与带引用答案。</p></div>
      <div class="heading-badges"><span>BM25</span><span>6 DOCS</span><span>ZH-CN</span></div>
    </section>

    <section class="query-console">
      <div class="query-input-wrap"><i data-lucide="sparkles"></i><textarea id="queryInput" rows="2" aria-label="检索问题">如何避免 RAG 答案编造并保留引用？</textarea></div>
      <div class="query-settings">
        <label><span>TOP-K</span><select id="queryTopK" aria-label="检索 Top-K"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></label>
        <label><span>MIN SCORE</span><input id="minScore" type="range" min="0" max="4" step="0.25" value="0"><b id="minScoreValue">0.00</b></label>
        <button class="button button-primary" id="runQuery" type="button"><i data-lucide="search"></i><span>运行检索</span></button>
      </div>
    </section>

    <section class="metric-grid query-metrics" aria-label="检索指标">
      <article><span>候选文档</span><strong id="queryCandidateMetric">--</strong><small>返回片段</small></article>
      <article><span>最高得分</span><strong id="queryTopScoreMetric">--</strong><small>BM25 score</small></article>
      <article><span>答案引用</span><strong id="queryCitationMetric">--</strong><small>文档 ID</small></article>
      <article><span>链路耗时</span><strong id="queryLatencyMetric">--</strong><small>确定性模拟</small></article>
    </section>

    <section class="query-layout">
      <article class="panel result-panel">
        <header class="panel-header"><div><p class="panel-kicker">RANKED CONTEXT</p><h2>检索结果</h2></div><span class="panel-note" id="resultCount">0 CHUNKS</span></header>
        <div class="retrieval-list" id="retrievalList"></div>
      </article>

      <div class="query-side">
        <article class="panel answer-panel">
          <header class="panel-header"><div><p class="panel-kicker">GROUNDED ANSWER</p><h2>答案草稿</h2></div><button class="icon-button" id="copyAnswer" type="button" title="复制答案" aria-label="复制答案"><i data-lucide="copy"></i></button></header>
          <div class="answer-content" id="answerContent"></div>
        </article>
        <article class="panel trace-panel">
          <header class="panel-header"><div><p class="panel-kicker">PIPELINE TRACE</p><h2>检索链路</h2></div><span class="status-chip">SUCCESS</span></header>
          <div class="trace-list" id="traceList"></div>
        </article>
      </div>
    </section>

    <section class="panel history-panel">
      <header class="panel-header"><div><p class="panel-kicker">LOCAL HISTORY</p><h2>最近查询</h2></div><button class="text-button" id="clearQueryHistory" type="button">清除记录</button></header>
      <div class="query-history" id="queryHistory"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
